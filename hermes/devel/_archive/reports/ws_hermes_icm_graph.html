output/aim_controller.py | Python 3 module (<60 lines) |\n| Stage Audit Receipt | output/check.md | YAML-frontmattered Markdown |\n\n## Check\n\nRun python3 -m py_compile output/aim_controller.py and verify < 5 ms CPU centroid latency and < 5 px error.\n", "stages/02-controller/output/check": "# Audit: PASS\n", "stages/02-controller/output/checkpoint": "# Checkpoint: AUTO_APPROVED_BY_CONTRACT\n", "stages/02-plan/CONTEXT": "# Stage 02 Contract: Architectural Planning & Reference Integrity (02-plan)\n\n## Inputs\n\n| Source | File/Location | Section/Scope | Why |\n| :--- | :--- | :--- | :--- |\n| Stage 01 Output | ../01-spec/output/spec_packet.md | Full file | Approved problem scope and invariants |\n| Substrate Map | ../../_config/substrate_ports.md | ## Active Daemon Table | Verify native port & plugin endpoints |\n| System One Gates | ../../rules/anti_rationalization_tables.md | ## Rule Guard | Verify compliance with ICM conventions |\n| ICM Architect | ~/.hermes/skills/icm-architect/SKILL.md | ## Reference Integrity | Enumerate all inbound links before moving files |\n\n## Process\n\n> 1. Read ../01-spec/output/spec_packet.md and map every required change to declarative configs, Markdown contracts, or official plugins.\n> 2. Perform reference integrity verification: before moving or archiving any file, enumerate all in-repo and systemd/cron references.\n> 3. If modifying skills, run hermes jev-curator plan to check 8-way semantic relations (duplicate, a_subset_of_b, conflict).\n> 4. Complete the Stage 02 Audit and write output/implementation_plan.md.\n\n## Outputs\n\n| Artifact | Location | Format |\n| :--- | :--- | :--- |\n| Implementation Plan | stages/02-plan/output/implementation_plan.md | Markdown with step-by-step diff specification |\n\n## Checkpoint & Audit\n\n* **Checkpoint**: Present output/implementation_plan.md for human gate review if modifying ~/.hermes/config.yaml or deleting files.\n* **Audit**: [ ] One-way stage references preserved; [ ] All CONTEXT.md edits remain < 80 lines; [ ] Zero circular dependencies.\n", "stages/02-plan/invariants": "# Stage Invariants (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 80 lines\n\n1. **Sub-8K Context Ceiling**: Active working context must remain strictly between 2,000 and 8,000 tokens.\n2. **Deterministic Output**: Stage outputs must be written as structured JSON/Markdown artifacts inside `output/`.\n3. **Hardware Realism**: Memory consumption on discrete NVIDIA RTX 3050 must not exceed 5,800.0 MiB.\n", "stages/02-plan/references": "# Stage Epistemic References (Layer 3)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 200 lines\n\n1. **ICM State Machine**: RinDig/icm-architect Invariants 1, 4, 7, and 9 (arXiv:2603.16021).\n2. **NousResearch Hermes Agent**: Built-in CLI flags (`--in`, `--accept-hooks`, `--max-turns 12`, `--tui`).\n3. **Port Topology**: Inference (8138), Gateway (8642), Memory (1933), Embeddings (8139).\n", "stages/02-plan/rules": "# Stage Operational Rules (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 120 lines\n\n1. **Clean Stage Handoff**: Read the input contract and previous stage output before mutating state.\n2. **Zero Monolithic Bloat**: Never perform multi-stage work in a single turn; terminate after generating the stage artifact.\n3. **Pre-Commit Verification**: Run local AST and linter checks (`ruff check`) before committing or closing the stage.\n", "stages/03-execute/CONTEXT": "# 03-execute - CDP Action Dispatch and Frame Telemetry\n\nOne job: Dispatch normalized mouse clicks via Playwright CDP and record output/telemetry.json.\n\n## Inputs\n\n| Source | File/Location | Section/Scope | Why |\n| :--- | :--- | :--- | :--- |\n| Stage 2 Output | ../02-controller/output/aim_controller.py | Centroid function | Target coordinates |\n| System Invariants | ../../_config/invariants.md | Section 2: Network Ports | CDP Port 9222 attachment |\n| Vision Schemas | ../../shared/vision_schemas.md | Telemetry Schema | Frame count & score keys |\n\nDo NOT load: ../01-probe/CONTEXT.md or ../../benchmarks/gauntlet_a_voxel_fps/.\n\n## Process\n\n> 1. Attach to Chromium on Port 9222 via Playwright connect_over_cdp(\"http://127.0.0.1:9222\").\n> 2. Execute the aiming loop using ../02-controller/output/aim_controller.py across >= 100 frames.\n> 3. Dispatch normalized mouse click actions to #gameCanvas.\n> 4. Save execution metrics (frames_captured, score, elapsed_s, vram_mib) to output/telemetry.json.\n\n## Outputs\n\n| Artifact | Location | Format |\n| :--- | :--- | :--- |\n| Execution Telemetry | output/telemetry.json | JSON receipt (frames >= 100, score >= 1) |\n| Stage Audit Receipt | output/check.md | YAML-frontmattered Markdown |\n\n## Check\n\nRun bash ../../benchmarks/gauntlet_b_splatbox/contract.sh and confirm 145 frames captured, score = 1, exit 0.\n", "stages/03-execute/invariants": "# Stage Invariants (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 80 lines\n\n1. **Sub-8K Context Ceiling**: Active working context must remain strictly between 2,000 and 8,000 tokens.\n2. **Deterministic Output**: Stage outputs must be written as structured JSON/Markdown artifacts inside `output/`.\n3. **Hardware Realism**: Memory consumption on discrete NVIDIA RTX 3050 must not exceed 5,800.0 MiB.\n", "stages/03-execute/output/check": "# Audit: PASS\n", "stages/03-execute/output/checkpoint": "# Checkpoint: AUTO_APPROVED_BY_CONTRACT\n", "stages/03-execute/references": "# Stage Epistemic References (Layer 3)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 200 lines\n\n1. **ICM State Machine**: RinDig/icm-architect Invariants 1, 4, 7, and 9 (arXiv:2603.16021).\n2. **NousResearch Hermes Agent**: Built-in CLI flags (`--in`, `--accept-hooks`, `--max-turns 12`, `--tui`).\n3. **Port Topology**: Inference (8138), Gateway (8642), Memory (1933), Embeddings (8139).\n", "stages/03-execute/rules": "# Stage Operational Rules (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 120 lines\n\n1. **Clean Stage Handoff**: Read the input contract and previous stage output before mutating state.\n2. **Zero Monolithic Bloat**: Never perform multi-stage work in a single turn; terminate after generating the stage artifact.\n3. **Pre-Commit Verification**: Run local AST and linter checks (`ruff check`) before committing or closing the stage.\n", "stages/04-verify/CONTEXT": "# Stage 04 Contract: Fresh-Session Verification & Decision Receipt (04-verify)\n\n## Inputs\n\n| Source | File/Location | Section/Scope | Why |\n| :--- | :--- | :--- | :--- |\n| Stage 01 Spec | ../01-spec/output/spec_packet.md | ## Acceptance Criteria | Original ground-truth requirements |\n| Stage 03 Manifest | ../03-execute/output/execution_manifest.md | Full file | Artifacts and hashes to verify |\n| System One Gates | ../../rules/anti_rationalization_tables.md | ## Claims & Commit Guards | Block unverified claims before Git commit |\n| ICM Walk Test | ~/.hermes/skills/icm-architect/SKILL.md | ## The Walk Test | 8-point cold-agent verification checklist |\n\n## Process\n\n> 1. Invoke the native delegate_task tool to spawn a fresh, zero-history subagent (\"Verifier Hat\").\n> 2. Instruct the subagent to cold-walk the workspace starting from AGENTS.md and independently verify every claim in execution_manifest.md.\n> 3. Execute the 8-point ICM Walk Test (wc -l check on all CONTEXT.md < 80 lines and rules/*.md < 200 lines).\n> 4. Write the signed verification report to output/verification_receipt.md and append a decision receipt to .hermes/decisions/.\n\n## Outputs\n\n| Artifact | Location | Format |\n| :--- | :--- | :--- |\n| Verification Receipt | stages/04-verify/output/verification_receipt.md | Markdown receipt signed by zero-history delegate_task |\n\n## Checkpoint & Audit\n\n* **Checkpoint**: Human review gate before git commit if any Walk Test item or Claims Guard check fails.\n* **Audit**: [ ] Verified by zero-history delegate_task; [ ] All CONTEXT.md < 80 lines; [ ] hermes doctor passes with 0 warnings.\n", "stages/04-verify/invariants": "# Stage Invariants (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 80 lines\n\n1. **Sub-8K Context Ceiling**: Active working context must remain strictly between 2,000 and 8,000 tokens.\n2. **Deterministic Output**: Stage outputs must be written as structured JSON/Markdown artifacts inside `output/`.\n3. **Hardware Realism**: Memory consumption on discrete NVIDIA RTX 3050 must not exceed 5,800.0 MiB.\n", "stages/04-verify/references": "# Stage Epistemic References (Layer 3)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 200 lines\n\n1. **ICM State Machine**: RinDig/icm-architect Invariants 1, 4, 7, and 9 (arXiv:2603.16021).\n2. **NousResearch Hermes Agent**: Built-in CLI flags (`--in`, `--accept-hooks`, `--max-turns 12`, `--tui`).\n3. **Port Topology**: Inference (8138), Gateway (8642), Memory (1933), Embeddings (8139).\n", "stages/04-verify/rules": "# Stage Operational Rules (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 120 lines\n\n1. **Clean Stage Handoff**: Read the input contract and previous stage output before mutating state.\n2. **Zero Monolithic Bloat**: Never perform multi-stage work in a single turn; terminate after generating the stage artifact.\n3. **Pre-Commit Verification**: Run local AST and linter checks (`ruff check`) before committing or closing the stage.\n"}, "types": ["untyped", "process", "claim", "concept", "object", "plan", "source"], "palette": {"untyped": "#1d4ed8", "process": "#15803d", "claim": "#c2410c", "concept": "#7e22ce", "object": "#b45309", "plan": "#0e7490", "source": "#b91c1c"}, "edges": [{"data": {"id": "skills/icm-architect/SKILL__skills/icm-architect/assets/templates/stage-CONTEXT", "source": "skills/icm-architect/SKILL", "target": "skills/icm-architect/assets/templates/stage-CONTEXT"}}, {"data": {"id": "skills/icm-architect/SKILL__skills/icm-architect/references/bundle-from-sources", "source": "skills/icm-architect/SKILL", "target": "skills/icm-architect/references/bundle-from-sources"}}, {"data": {"id": "skills/icm-architect/SKILL__skills/icm-architect/references/core", "source": "skills/icm-architect/SKILL", "target": "skills/icm-architect/references/core"}}, {"data": {"id": "skills/icm-architect/SKILL__skills/icm-architect/references/forms", "source": "skills/icm-architect/SKILL", "target": "skills/icm-architect/references/forms"}}, {"data": {"id": "skills/icm-architect/SKILL__skills/icm-architect/references/system-map", "source": "skills/icm-architect/SKILL", "target": "skills/icm-architect/references/system-map"}}, {"data": {"id": "skills/icm-architect/assets/templates/entry__skills/icm-architect/assets/templates/questionnaire", "source": "skills/icm-architect/assets/templates/entry", "target": "skills/icm-architect/assets/templates/questionnaire"}}, {"data": {"id": "skills/icm-architect/references/forms__skills/icm-architect/references/bundle-from-sources", "source": "skills/icm-architect/references/forms", "target": "skills/icm-architect/references/bundle-from-sources"}}, {"data": {"id": "skills/icm-architect/references/forms__skills/icm-architect/references/system-map", "source": "skills/icm-architect/references/forms", "target": "skills/icm-architect/references/system-map"}}], "root": "skills/icm-architect/SKILL"};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Show the most-linked node first
  const initial =
    bundle.nodes.find((n) => n.data.id === bundle.root) ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
</body>
