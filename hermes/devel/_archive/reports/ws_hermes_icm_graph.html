.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {

  grid-template-columns: 90px 1fr;

  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">markdown graph</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>

      </header>

        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>

Never ask retailer URL**. Ground all inquiries in internal product/order records. |\n| *\"I assume the pending order allows payment method mutation without checking.\"* | Order modification requires checking policy constraints (e.g. pending vs shipped status). | **Always call `get_order_details`** first to inspect order status before mutating state. |\n\n## 2. Code Synthesis & Verification Rationalisations\n\n| Common Rationalisation / Excuse | Reality & Structural Barrier | Mandatory Deterministic Action |\n| :--- | :--- | :--- |\n| *\"The function is simple enough that running pre-commit linters is unnecessary.\"* | 61.3% of 4B failures are variable renames and syntax errors caught instantly by linters. | **Always run `ruff check`** and AST parse prior to advancing to verification stage. |\n| *\"I will modify the test assertion to match my generated output.\"* | Test assertions define canonical ground truth. Modifying them breaches purity invariants. | **Never modify test assertions**. Fix the implementation or prompt contract. |\n| *\"The trailing syntax error doesn't matter because the main algorithm is sound.\"* | Automated evaluation harnesses (UK AISI Inspect AI) evaluate execution exit status. | **Always ensure valid AST**. Truncate broken trailing lines cleanly. |\n| *\"I will implement all steps in a single massive turn without verifying.\"* | Large speculative edits trigger cascading errors exceeding the 4B model's recovery window. | **Enforce Karpathy U12**: Apply one causal change per turn (<= 15 lines diff). |\n", "_config/anti_sycophancy_directives": "# Layer 3 Reference: 17 Anti-Sycophancy & Epistemic Persistence Directives\n\n> **Invariance Rule**: Enforces cognitive resilience against sycophantic capitulation.\n> **Line Limit**: Strictly capped <= 200 lines.\n\n1. **Ground Truth Over Authority**: Never validate an incorrect premise solely because the user asserts it.\n2. **Empirical Verification First**: When claims conflict with system state, run bash/Python inspection before conceding.\n3. **Receipt Sealing Invariant**: Never report a task as complete without a cryptographically sealed `/tmp/hermes_verified_receipt.json`.\n4. **Pre-Commit Gate Immunity**: Do not bypass ruff or AST verification under urgency or user pressure.\n5. **No Hallucinated Apologies**: Do not issue prolonged apologies; report exact exception tracebacks and next causal step.\n6. **No Phantom Tools**: Never invent function signatures not declared in the active FastMCP tool schema.\n7. **Refuse Unsafe System State**: If live NVML VRAM exceeds 5,400 MiB, abort immediately without proceeding.\n8. **Preserve Substrate Purity**: Upstream `.hermes/hermes-agent` must remain 100% clean (`git status --porcelain == \"\"`).\n9. **One Fact, One Home**: Never duplicate canonical rules across multiple documentation files.\n10. **Selective Section Loading**: Read only the targeted markdown section specified in 4-column load tables.\n11. **Walk Test Feasibility**: Ensure any freshly initialized agent can navigate the workspace using only local files.\n12. **Epistemic Read Precedence**: In tool-calling scenarios, query read tools before mutating state or escalating.\n13. **Strict Line Caps**: Reject any `CONTEXT.md` exceeding 80 lines or reference file exceeding 200 lines.\n14. **Deterministic Exit Codes**: Treat exit code != 0 as an explicit strike requiring tabu rollback on Strike 2.\n15. **Clean Fences**: Never emit naked Python code outside ````python ... ```` fences for benchmark extractors.\n16. **No Speculative Overhauls**: Limit causal edits to single focused symbols per turn (Karpathy U12).\n17. **Fresh-Session Objective Review**: Evaluate state mutations independently of conversational narrative bias.\n", "_config/conventions": "# Layer 3: ICM Core Conventions and Invariants\n\n## The 15 Conventions\n1. Stage Contracts: Every stage has Inputs, Process, Outputs, and Check.\n2. Stage Handoffs: Output folders connect stages directly.\n3. One-Way References: Dependencies flow in one direction only.\n4. Selective Section Routing: Load only needed sections from reference files.\n5. Canonical Sources: Every fact has one authoritative home.\n6. Specs Are Contracts: Specs state WHAT and WHEN; build defines HOW.\n7. Checkpoints: Pause execution for human review at major milestones.\n8. Stage Audits: Automated verification before saving final outputs.\n9. Value Validation: Explicit schema and type validation.\n10. Docs Over Outputs: Learn patterns from Layer 3 references, never previous outputs.\n11. Questionnaire Design: Fast, all-at-once onboarding configuration.\n12. Shared Constants: Centralized constants prevent scattered magic values.\n13. Strict Line Limits: CONTEXT.md < 80 lines; references < 200 lines.\n14. Clean Output State: Do not commit generated run artifacts.\n15. System-Level Setup: Configure the production factory once.\n", "_config/glossary": "# Layer 3: Controlled Technical Lexicon (ASD-STE100)\n\n## Terminology\n- **Stage**: A single directory executing one specific transformation step.\n- **Contract**: A markdown document defining Inputs, Process, Outputs, and Check.\n- **Substrate**: The underlying AI inference engine and runtime operating system.\n- **Factory**: The collection of templates, rules, and scripts that govern execution.\n- **Product**: The per-run deliverables and artifacts written to output directories.\n", "_config/hardware_limits": "# Layer 3: Hardware Limits and Operating Rules\n\n## Discrete GPU Envelope\n- Device: NVIDIA GeForce RTX 3050 Laptop GPU (6,144 MiB physical GDDR6).\n- Maximum Active VRAM: 5,800.0 MiB under 128K context.\n- Maximum Quiescent VRAM: 100.0 MiB when daemon is stopped.\n- Display Compositor: Wayland runs on Intel integrated GPU (`Disp.A: Off`).\n", "_config/hardware_vram_invariants": "# Layer 3 Factory Rule: Hardware & 128K VRAM Invariants (hardware_vram_invariants.md)\n\n> Layer 3 Reference Contract: Physical Hardware Boundaries & Verification Gates.\n> Rule: File must remain strictly under 200 lines.\n\n---\n\n## 1. Dedicated Physical GPU Envelope\n\n* **GPU**: NVIDIA GeForce RTX 3050 Laptop GPU (6,144 MiB physical GDDR6).\n* **Display Isolation (Disp.A: Off)**: Wayland compositor (`kwin_wayland`) runs on the integrated AMD Radeon GPU, using only 6 MiB on the NVIDIA card. Full 6,138 MiB is dedicated to compute.\n* **Hard NVML Ceiling**: Active GPU VRAM must never exceed **5,800.0 MiB** (`nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits`), guaranteeing >= 344 MiB physical safety margin.\n\n---\n\n## 2. Canonical 128K Engine & KV Cache Invariant (Port 8138)\n\n* **Context Window**: `-c 131072` (`context_length: 131072`), satisfying upstream `MINIMUM_CONTEXT_LENGTH = 64000` (`agent/model_metadata.py`) and optimal `ContextCompressor` thresholds.\n* **KV Cache Quantization**: Google TurboQuant 4-bit KV cache (`-ctk q4_0 -ctv q4_0 -fa 1`), keeping the 128K KV buffer at ~1,075 MiB.\n* **CPU & Swap Isolation**: Port 8138 inference pinned to cores 0–5 (`taskset -c 0-5 -t 6 -tb 6`); cores 6–11 reserved for host OS, Port 8139 CPU embeddings, and Port 1933 OpenViking; backed by 15.3 GiB zram + 2,048 MiB btrfs NOCOW swapfile (`/var/swap/swapfile`).\n\n---\n\n## 3. Candidate Model Footprint Envelopes (at -c 131072 -ctk q4_0 -ctv q4_0)\n\n* **Baseline (`google/gemma-4-E4B-it-qat` + MTP)**: 5,201–5,239 MiB measured active (905 MiB free).\n* **Tier 1A (`xbill9/gemma-4-E4B-it-qat-exact` + Assistant)**: 5,128 MiB projected active (1,016 MiB free).\n* **Tier 1B (`unsloth/nemotron-3.5-bolt-e4b` + DFlash)**: 5,554 MiB projected active (590 MiB free).\n\n---\n\n## 4. Live NVML Verification Gate\n\nAny execution stage mutating or testing models must verify live VRAM using:\n```bash\nVRAM_USED=$(nvidia-smi --query-gpu=memory.used --format=csv,noheader,nounits | head -n1 | tr -d ' ')\ntest \"$VRAM_USED\" -le 5800\n```\nIf VRAM exceeds 5,800.0 MiB, halt execution immediately.\n", "_config/invariants": "# Layer 3: Hermes System-Wide Invariants (Tripartite 60% Core)\n\n## 1. Hardware and VRAM Envelope Invariants\n\n* Host OS: Fedora Kinoite 44 (x86_64, rpm-ostree immutable atomic desktop).\n* Discrete GPU: NVIDIA GeForce RTX 3050 Laptop GPU (6,144 MiB physical GDDR6).\n* Hard VRAM Safety Ceiling (Active Inference): 5,800.0 MiB maximum under 131,072-token (128K) context with Q4_0 TurboQuant KV cache (-ctk q4_0 -ctv q4_0).\n* Quiescent VRAM Ceiling (Daemon Stopped): <= 100.0 MiB (40 MiB nominal idle at ~55°C, 12W) when hermes-llama-server.service is stopped.\n* Display Compositor Offload: Wayland compositor must run on the Intel integrated GPU (Disp.A: Off on NVIDIA nvidia-smi).\n* CPU Vision Offload: Computer vision centroid calculations (OpenCV HoughCircles) must run on host CPU (0 MiB GPU VRAM, < 5 ms frame latency).\n\n## 2. Canonical Network Port Map\n\n* Port 8138: Local llama-server OpenAI-compatible inference engine (http://127.0.0.1:8138/v1) and /slots endpoint.\n* Port 8642: Hermes Agent Gateway API server (http://127.0.0.1:8642/v1).\n* Port 1933: OpenViking persistent memory graph daemon (http://127.0.0.1:1933).\n* Port 8139: Dedicated SmolVLM2 vision daemon (on-demand).\n* Port 9222: Chromium / Chrome DevTools Protocol (CDP) debugging endpoint (http://127.0.0.1:9222).\n\n## 3. Execution and Verification Invariants\n\n* Champion Primary Substrate: xbill9/gemma-4-E4B-it-qat-q4_0-exact.gguf (4,169 MiB VRAM at 128K).\n* Secondary Substrate: unsloth/NVIDIA-Nemotron-3.5-Bolt-E4B-UD-Q4_K_XL.gguf (4,975 MiB VRAM at 128K).\n* Deprecated Substrate: google/gemma-4-E4B-it-qat-q4_0-gguf (prohibited for tool calling due to QAT logit shift).\n* Read-Before-Edit Law: Every fresh-context stage must invoke read_file on existing disk targets prior to calling file-edit tools.\n* Headless Runtime Gate: Every browser/WebGL deliverable must pass the 4-Gate Playwright Runtime Audit (0 console errors, 0 page errors, 0 HTTP 4xx/5xx responses, 1280x720 non-degenerate pixel variance).\n", "_config/operational_rules": "# Root Operational Rules (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Strict Line Budget: <= 120 lines\n\n1. **Deterministic Sequential Stage Execution**:\n   - Every complex engineering requirement must traverse the 4-stage pipeline sequentially:\n     `01-spec` -> `02-plan` -> `03-execute` -> `04-verify`.\n   - Never skip directly to execution without an approved specification and signed contract.\n\n2. **Contract-First Verification**:\n   - Each operational directory must contain a deterministic `contract.sh` with `set -euo pipefail`.\n   - All tests must run headlessly and verify syntax, AST structure, and exit code 0.\n\n3. **Two-Strike Tabu Rule**:\n   - If an agent generates code that fails verification twice, it must revert to the last green checkpoint and try an alternative architecture.\n\n4. **Normalized Output Rule**:\n   - Autonomous verification evaluations must emit exact ground-truth values without conversational conversational prefixes.\n\n5. **Tool Call Protocol**:\n   - All tool calls must be emitted in structured JSON format; plain text leaks are strictly forbidden.\n", "_config/references": "# Root Epistemic References Index (Layer 3)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Strict Line Budget: <= 200 lines\n\n## Core Methodologies & Literature\n1. **Interpretable Context Methodology (ICM / MWP)**:\n   - Reference: Jake Van Clief & David McDermott (arXiv:2603.16021)\n   - Principles: File-system state machines, 60/30/10 layering, working context between 2k and 8k tokens.\n\n2. **Nested Learning**:\n   - Reference: Behrouz et al., Google Research (arXiv:2512.24695)\n   - Principles: Multi-timescale associative memory: Level 1 (KV/SSM), Level 2 (Stage surprise score), Level 3 (Ebbinghaus vault).\n\n3. **Dream-RSI (Autonomous Recursive Self-Improvement)**:\n   - Reference: Zheng et al. (arXiv:2609.14858)\n   - Principles: Dual-pass bracketed schedule, off-policy Doubly Robust estimation, evolving world discovery trees.\n\n4. **Agentic Design Patterns**:\n   - Reference: Antonio Gullí (21 Patterns)\n   - Principles: Anti-reflection loops, anti-memory hoarding, tool-grounding gates, deterministic contracts.\n", "_config/substrate_ports": "# Substrate Port Registry & Architecture Map\n\n> Layer 3 Reference Contract: Canonical Port Definitions for Hermes Agent OS.\n> Rule: File must remain strictly under 200 lines.\n\n---\n\n## Active Daemon Port Table\n\n| Port | Service / Daemon | Process / Technology | Binding & Interface | Resource Allocation |\n| :--- | :--- | :--- | :--- | :--- |\n| **8138** | GPU Inference Engine | `llama-server` (Gemma 4 E4B QAT) | `http://127.0.0.1:8138/v1` | Discrete NVIDIA RTX 3050 Laptop GPU (<= 5,400.0 MiB VRAM), CPU threads 0–5 |\n| **8139** | CPU Representation Daemon | `hermes-embedding-cpu.service` (`embeddinggemma-2-Q8_0`) | `http://127.0.0.1:8139/v1` | 0.0 MiB GPU VRAM (`CUDA_VISIBLE_DEVICES=\"\"`), CPU threads 6–11 |\n| **8642** | Hermes Gateway Server | `gateway.platforms.api_server` (`hermes gateway`) | `http://127.0.0.1:8642/v1` | Host Network (Localhost only), `API_SERVER_KEY` authentication |\n| **1933** | Hierarchical Memory Server | `openviking-server` (`TrieHI` Architecture) | `http://127.0.0.1:1933` | Host Memory & Disk (`.openviking/data`), 0.0 MiB GPU VRAM |\n\n---\n\n## Decommissioned Ports & Proxies\n\n* **Port 1934 (Decommissioned)**: Legacy `mcp_ephemeral_bridge.py` proxy is permanently retired. Benchmark and client requests route directly to Port 8642.\n", "shared/netcode_protocol": "# Shared Reference: Multiplayer Netcode Protocol (Gauntlet A)\n\n## Protocol Invariants\n- Transport: WebSocket on Port 8080.\n- Broadcast Frequency: 20 Hz fixed tick loop (50 ms interval).\n- Client Packet Schema: Supports `data.type || data.t`.\n- Handshake Sequence: Server sends `join` / `WELCOME` on connection with client ID.\n- Position Broadcast: Serialized x, y, z positions with interpolation.\n- Voxel Splat Broadcast: Position, color hex, and voxel mutation type.\n", "shared/shader_conventions": "# Shared Reference: Shader & Buoyancy Conventions (Gauntlet C)\n\n## Three.js Shader Invariants\n- Library Version: Three.js `three@0.165.0`.\n- ShaderMaterial Uniforms Property: Strictly plural `uniforms: { ... }`. Singular `uniform:` is invalid.\n- Water GPGPU: Dual framebuffer wave PDE ping-pong on floating-point textures.\n- Caustics Shader: Differential area mapping using dFdx/dFdy.\n- Buoyancy Physics: Clamped spherical-cap volume integration with drag damping.\n", "shared/vision_schemas": "# Shared Reference: Vision and Centroid Schemas (Gauntlet B)\n\n## Vision Invariants\n- Target Canvas: `#gameCanvas` at 1280x720 CSS pixels.\n- High-DPI Scale Ratio: `canvas.width / rect.width` and `canvas.height / rect.height`.\n- Aiming Algorithm: OpenCV CPU `cv2.HoughCircles` detection (dp=1.2, minDist=30, param1=50, param2=30).\n- Latency Constraint: < 5 ms frame latency on CPU (0 MiB GPU VRAM).\n- Precision Constraint: < 5 px aiming error relative to target center.\n- Telemetry Schema: JSON with `frames_captured`, `score`, `elapsed_s`, and `vram_mib`.\n", "stages/01-probe/CONTEXT": "# 01-probe - Browser and Canvas State Discovery\n\nOne job: Probe the browser canvas and write target metadata to output/probe_state.json.\n\n## Inputs\n\n| Source | File/Location | Section/Scope | Why |\n| :--- | :--- | :--- | :--- |\n| System Invariants | `../../_config/invariants.md` | Network Ports | Port 9222 connection |\n| Vision Schemas | `../../shared/vision_schemas.md` | Vision Invariants | Coordinate normalization |\n\nDo NOT load: ../02-controller/, ../03-execute/, or ../../benchmarks/.\n\n## Process\n\n> 1. Connect to Chrome CDP on Port 9222 using Playwright.\n> 2. Locate the Splatbox HTML5 canvas element (`#gameCanvas`).\n> 3. Capture a 1280x720 screenshot of the canvas.\n> 4. Extract canvas CSS bounding box dimensions.\n> 5. Save metadata to output/probe_state.json.\n\n## Outputs\n\n| Artifact | Location | Format |\n| :--- | :--- | :--- |\n| Probe State | output/probe_state.json | JSON schema with canvas rect |\n| Stage Audit Receipt | output/check.md | YAML-frontmattered Markdown |\n\n## Check\n\nRun python3 -m json.tool output/probe_state.json and verify width and height keys exist.\n", "stages/01-probe/output/check": "# Audit: PASS\n", "stages/01-probe/output/checkpoint": "# Checkpoint: AUTO_APPROVED_BY_CONTRACT\n", "stages/01-spec/CONTEXT": "# Stage 01 Contract: Specification & Intent Scoping (01-spec)\n\n## Inputs\n\n| Source | File/Location | Section/Scope | Why |\n| :--- | :--- | :--- | :--- |\n| User Task | Active Prompt / Issue | Full description | Primary problem statement |\n| Hardware Rules | `../../_config/hardware_vram_invariants.md` | ## Envelope Limits | Enforce hardware VRAM & zero-code bounds per rules/hardware_vram_invariants.md |\n| System One Gates | `../../_config/anti_rationalization_tables.md` | ## Intent & Scope Guards | Prevent scope creep and unrequested code |\n| Epistemic Rules | `../../_config/anti_sycophancy_directives.md` | ## Premise Validation | Reject flawed user assumptions early |\n\n## Process\n\n> 1. Parse the user request and inspect referenced files using native file_tools or openviking memory search.\n> 2. Validate the request against Intent Guard and Scope Guard: confirm zero custom orchestration scripts are requested.\n> 3. Define explicit acceptance criteria, touched file boundaries, and hardware invariants.\n> 4. Run the Stage 01 Audit below and write output/spec_packet.md.\n\n## Outputs\n\n| Artifact | Location | Format |\n| :--- | :--- | :--- |\n| Specification Packet | stages/01-spec/output/spec_packet.md | Markdown with YAML frontmatter (status, scope_hash) |\n\n## Checkpoint & Audit\n\n* **Checkpoint**: Pause if user requirements conflict with the Zero-Custom-Code Imperative or rules/hardware_vram_invariants.md ceiling.\n* **Audit**: [ ] Exact target files listed; [ ] No custom .py wrappers proposed; [ ] Hardware ceiling explicitly cited.\n", "stages/01-spec/invariants": "# Stage Invariants (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 80 lines\n\n1. **Sub-8K Context Ceiling**: Active working context must remain strictly between 2,000 and 8,000 tokens.\n2. **Deterministic Output**: Stage outputs must be written as structured JSON/Markdown artifacts inside `output/`.\n3. **Hardware Realism**: Memory consumption on discrete NVIDIA RTX 3050 must not exceed 5,800.0 MiB.\n", "stages/01-spec/references": "# Stage Epistemic References (Layer 3)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 200 lines\n\n1. **ICM State Machine**: RinDig/icm-architect Invariants 1, 4, 7, and 9 (arXiv:2603.16021).\n2. **NousResearch Hermes Agent**: Built-in CLI flags (`--in`, `--accept-hooks`, `--max-turns 12`, `--tui`).\n3. **Port Topology**: Inference (8138), Gateway (8642), Memory (1933), Embeddings (8139).\n", "stages/01-spec/rules": "# Stage Operational Rules (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 120 lines\n\n1. **Clean Stage Handoff**: Read the input contract and previous stage output before mutating state.\n2. **Zero Monolithic Bloat**: Never perform multi-stage work in a single turn; terminate after generating the stage artifact.\n3. **Pre-Commit Verification**: Run local AST and linter checks (`ruff check`) before committing or closing the stage.\n", "stages/02-controller/CONTEXT": "# 02-controller - CPU OpenCV HoughCircles Aiming Controller\n\nOne job: Compute target centroids on CPU from probe metadata and write output/aim_controller.py.\n\n## Inputs\n\n| Source | File/Location | Section/Scope | Why |\n| :--- | :--- | :--- | :--- |\n| Stage 1 Output | ../01-probe/output/probe_state.json | Full JSON file | Canvas bounding rect & DPI ratio |\n| System Invariants | `../../_config/invariants.md` | Section 1: CPU Vision Offload | Enforce 0 MiB GPU VRAM & <5 ms |\n| Vision Schemas | `../../shared/vision_schemas.md` | HoughCircles Parameters | Coordinate scaling math |\n\nDo NOT load: ../03-execute/, ../../benchmarks/, or ../../phases/.\n\n## Process\n\n> 1. Read ../01-probe/output/probe_state.json and verify width and height keys exist.\n> 2. Calculate CSS-to-canvas coordinate scale ratio (canvas.width / rect.width).\n> 3. Implement OpenCV cv2.HoughCircles centroid detection on CPU (0 MiB GPU VRAM, < 5 ms execution).\n> 4. Write the modular controller (<60 lines) to output/aim_controller.py.\n\n## Outputs\n\n| Artifact | Location | Format |\n| :--- | :--- | :--- |\n| Aiming Controller | output/aim_controller.py | Python 3 module (<60 lines) |\n| Stage Audit Receipt | output/check.md | YAML-frontmattered Markdown |\n\n## Check\n\nRun python3 -m py_compile output/aim_controller.py and verify < 5 ms CPU centroid latency and < 5 px error.\n", "stages/02-controller/output/check": "# Audit: PASS\n", "stages/02-controller/output/checkpoint": "# Checkpoint: AUTO_APPROVED_BY_CONTRACT\n", "stages/02-plan/CONTEXT": "# Stage 02 Contract: Architectural Planning & Reference Integrity (02-plan)\n\n## Inputs\n\n| Source | File/Location | Section/Scope | Why |\n| :--- | :--- | :--- | :--- |\n| Stage 01 Output | ../01-spec/output/spec_packet.md | Full file | Approved problem scope and invariants |\n| Substrate Map | `../../_config/substrate_ports.md` | ## Active Daemon Table | Verify native port & plugin endpoints |\n| System One Gates | `../../_config/anti_rationalization_tables.md` | ## Rule Guard | Verify compliance with ICM conventions |\n| ICM Architect | ~/.hermes/skills/icm-architect/SKILL.md | ## Reference Integrity | Enumerate all inbound links before moving files |\n\n## Process\n\n> 1. Read ../01-spec/output/spec_packet.md and map every required change to declarative configs, Markdown contracts, or official plugins.\n> 2. Perform reference integrity verification: before moving or archiving any file, enumerate all in-repo and systemd/cron references.\n> 3. If modifying skills, run hermes jev-curator plan to check 8-way semantic relations (duplicate, a_subset_of_b, conflict).\n> 4. Complete the Stage 02 Audit and write output/implementation_plan.md.\n\n## Outputs\n\n| Artifact | Location | Format |\n| :--- | :--- | :--- |\n| Implementation Plan | stages/02-plan/output/implementation_plan.md | Markdown with step-by-step diff specification |\n\n## Checkpoint & Audit\n\n* **Checkpoint**: Present output/implementation_plan.md for human gate review if modifying ~/.hermes/config.yaml or deleting files.\n* **Audit**: [ ] One-way stage references preserved; [ ] All CONTEXT.md edits remain < 80 lines; [ ] Zero circular dependencies.\n", "stages/02-plan/invariants": "# Stage Invariants (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 80 lines\n\n1. **Sub-8K Context Ceiling**: Active working context must remain strictly between 2,000 and 8,000 tokens.\n2. **Deterministic Output**: Stage outputs must be written as structured JSON/Markdown artifacts inside `output/`.\n3. **Hardware Realism**: Memory consumption on discrete NVIDIA RTX 3050 must not exceed 5,800.0 MiB.\n", "stages/02-plan/references": "# Stage Epistemic References (Layer 3)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 200 lines\n\n1. **ICM State Machine**: RinDig/icm-architect Invariants 1, 4, 7, and 9 (arXiv:2603.16021).\n2. **NousResearch Hermes Agent**: Built-in CLI flags (`--in`, `--accept-hooks`, `--max-turns 12`, `--tui`).\n3. **Port Topology**: Inference (8138), Gateway (8642), Memory (1933), Embeddings (8139).\n", "stages/02-plan/rules": "# Stage Operational Rules (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 120 lines\n\n1. **Clean Stage Handoff**: Read the input contract and previous stage output before mutating state.\n2. **Zero Monolithic Bloat**: Never perform multi-stage work in a single turn; terminate after generating the stage artifact.\n3. **Pre-Commit Verification**: Run local AST and linter checks (`ruff check`) before committing or closing the stage.\n", "stages/03-execute/CONTEXT": "# 03-execute - CDP Action Dispatch and Frame Telemetry\n\nOne job: Dispatch normalized mouse clicks via Playwright CDP and record output/telemetry.json.\n\n## Inputs\n\n| Source | File/Location | Section/Scope | Why |\n| :--- | :--- | :--- | :--- |\n| Stage 2 Output | ../02-controller/output/aim_controller.py | Centroid function | Target coordinates |\n| System Invariants | `../../_config/invariants.md` | Section 2: Network Ports | CDP Port 9222 attachment |\n| Vision Schemas | `../../shared/vision_schemas.md` | Telemetry Schema | Frame count & score keys |\n\nDo NOT load: ../01-probe/CONTEXT.md or ../../benchmarks/gauntlet_a_voxel_fps/.\n\n## Process\n\n> 1. Attach to Chromium on Port 9222 via Playwright connect_over_cdp(\"http://127.0.0.1:9222\").\n> 2. Execute the aiming loop using ../02-controller/output/aim_controller.py across >= 100 frames.\n> 3. Dispatch normalized mouse click actions to #gameCanvas.\n> 4. Save execution metrics (frames_captured, score, elapsed_s, vram_mib) to output/telemetry.json.\n\n## Outputs\n\n| Artifact | Location | Format |\n| :--- | :--- | :--- |\n| Execution Telemetry | output/telemetry.json | JSON receipt (frames >= 100, score >= 1) |\n| Stage Audit Receipt | output/check.md | YAML-frontmattered Markdown |\n\n## Check\n\nRun bash ../../benchmarks/gauntlet_b_splatbox/contract.sh and confirm 145 frames captured, score = 1, exit 0.\n", "stages/03-execute/invariants": "# Stage Invariants (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 80 lines\n\n1. **Sub-8K Context Ceiling**: Active working context must remain strictly between 2,000 and 8,000 tokens.\n2. **Deterministic Output**: Stage outputs must be written as structured JSON/Markdown artifacts inside `output/`.\n3. **Hardware Realism**: Memory consumption on discrete NVIDIA RTX 3050 must not exceed 5,800.0 MiB.\n", "stages/03-execute/output/check": "# Audit: PASS\n", "stages/03-execute/output/checkpoint": "# Checkpoint: AUTO_APPROVED_BY_CONTRACT\n", "stages/03-execute/references": "# Stage Epistemic References (Layer 3)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 200 lines\n\n1. **ICM State Machine**: RinDig/icm-architect Invariants 1, 4, 7, and 9 (arXiv:2603.16021).\n2. **NousResearch Hermes Agent**: Built-in CLI flags (`--in`, `--accept-hooks`, `--max-turns 12`, `--tui`).\n3. **Port Topology**: Inference (8138), Gateway (8642), Memory (1933), Embeddings (8139).\n", "stages/03-execute/rules": "# Stage Operational Rules (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 120 lines\n\n1. **Clean Stage Handoff**: Read the input contract and previous stage output before mutating state.\n2. **Zero Monolithic Bloat**: Never perform multi-stage work in a single turn; terminate after generating the stage artifact.\n3. **Pre-Commit Verification**: Run local AST and linter checks (`ruff check`) before committing or closing the stage.\n", "stages/04-verify/CONTEXT": "# Stage 04 Contract: Fresh-Session Verification & Decision Receipt (04-verify)\n\n## Inputs\n\n| Source | File/Location | Section/Scope | Why |\n| :--- | :--- | :--- | :--- |\n| Stage 01 Spec | ../01-spec/output/spec_packet.md | ## Acceptance Criteria | Original ground-truth requirements |\n| Stage 03 Manifest | ../03-execute/output/execution_manifest.md | Full file | Artifacts and hashes to verify |\n| System One Gates | `../../_config/anti_rationalization_tables.md` | ## Claims & Commit Guards | Block unverified claims before Git commit |\n| ICM Walk Test | ~/.hermes/skills/icm-architect/SKILL.md | ## The Walk Test | 8-point cold-agent verification checklist |\n\n## Process\n\n> 1. Invoke the native delegate_task tool to spawn a fresh, zero-history subagent (\"Verifier Hat\").\n> 2. Instruct the subagent to cold-walk the workspace starting from AGENTS.md and independently verify every claim in execution_manifest.md.\n> 3. Execute the 8-point ICM Walk Test (wc -l check on all CONTEXT.md < 80 lines and rules/*.md < 200 lines).\n> 4. Write the signed verification report to output/verification_receipt.md and append a decision receipt to .hermes/decisions/.\n\n## Outputs\n\n| Artifact | Location | Format |\n| :--- | :--- | :--- |\n| Verification Receipt | stages/04-verify/output/verification_receipt.md | Markdown receipt signed by zero-history delegate_task |\n\n## Checkpoint & Audit\n\n* **Checkpoint**: Human review gate before git commit if any Walk Test item or Claims Guard check fails.\n* **Audit**: [ ] Verified by zero-history delegate_task; [ ] All CONTEXT.md < 80 lines; [ ] hermes doctor passes with 0 warnings.\n", "stages/04-verify/invariants": "# Stage Invariants (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 80 lines\n\n1. **Sub-8K Context Ceiling**: Active working context must remain strictly between 2,000 and 8,000 tokens.\n2. **Deterministic Output**: Stage outputs must be written as structured JSON/Markdown artifacts inside `output/`.\n3. **Hardware Realism**: Memory consumption on discrete NVIDIA RTX 3050 must not exceed 5,800.0 MiB.\n", "stages/04-verify/references": "# Stage Epistemic References (Layer 3)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 200 lines\n\n1. **ICM State Machine**: RinDig/icm-architect Invariants 1, 4, 7, and 9 (arXiv:2603.16021).\n2. **NousResearch Hermes Agent**: Built-in CLI flags (`--in`, `--accept-hooks`, `--max-turns 12`, `--tui`).\n3. **Port Topology**: Inference (8138), Gateway (8642), Memory (1933), Embeddings (8139).\n", "stages/04-verify/rules": "# Stage Operational Rules (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 120 lines\n\n1. **Clean Stage Handoff**: Read the input contract and previous stage output before mutating state.\n2. **Zero Monolithic Bloat**: Never perform multi-stage work in a single turn; terminate after generating the stage artifact.\n3. **Pre-Commit Verification**: Run local AST and linter checks (`ruff check`) before committing or closing the stage.\n"}, "types": ["untyped"], "palette": {"untyped": "#1d4ed8"}, "edges": [], "root": "CONTEXT"};
</script>
<script>
(function () {
  const bundle = window.BUNDLE;
  const bundleName = window.BUNDLE_NAME;
  document.title = `${bundleName} — OKF Viewer`;
  document.getElementById("bundle-name").textContent = bundleName;

  // Populate type filter
  const typeSelect = document.getElementById("filter-type");
  for (const t of bundle.types) {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = t;
    typeSelect.appendChild(opt);
  }

  // Build reverse-link index for backlinks
  const backlinks = {};
  for (const edge of bundle.edges) {
    const { source, target } = edge.data;
    (backlinks[target] ||= []).push(source);
  }

  // Look up node label/type by id
  const nodeIndex = {};
  for (const n of bundle.nodes) nodeIndex[n.data.id] = n.data;

  const cy = cytoscape({
    container: document.getElementById("graph"),
    elements: [...bundle.nodes, ...bundle.edges],
    style: [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "label": "data(label)",
          "color": "#0f172a",
          "font-size": 11,
          "text-valign": "bottom",
          "text-margin-y": 4,
          "text-wrap": "wrap",
          "text-max-width": 120,
          "width": "data(size)",
          "height": "data(size)",
          "border-width": 1,
          "border-color": "#0f172a",
        },
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 3,
          "border-color": "#f59e0b",
        },
      },
      {
        selector: "edge",
        style: {
          "width": 1.5,
          "line-color": "#cbd5e1",
          "target-arrow-color": "#cbd5e1",
          "target-arrow-shape": "triangle",
          "curve-style": "bezier",
          "arrow-scale": 0.9,
        },
      },
      {
        selector: "edge:selected",
        style: {
          "line-color": "#f59e0b",
          "target-arrow-color": "#f59e0b",
          "width": 2.5,
        },
      },
      {
        selector: ".dim",
        style: { "opacity": 0.15 },
      },
    ],
    layout: { name: "cose", animate: false, padding: 30 },
    wheelSensitivity: 0.2,
  });

  cy.on("tap", "node", (evt) => showDetail(evt.target.id()));
  cy.on("tap", (evt) => {
    if (evt.target === cy) clearSelection();
  });

  document.getElementById("layout").addEventListener("change", (e) => {
    cy.layout({ name: e.target.value, animate: false, padding: 30 }).run();
  });

  document.getElementById("reset").addEventListener("click", () => {
    cy.fit(null, 30);
    clearSelection();
  });

  document.getElementById("search").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    if (!q) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      const d = n.data();
      const hay =
        (d.label || "").toLowerCase() + " " +
        d.id.toLowerCase() + " " +
        (d.tags || []).join(" ").toLowerCase();
      n.toggleClass("dim", !hay.includes(q));
    });
    cy.edges().forEach((edge) => {
      const src = edge.source();
      const tgt = edge.target();
      edge.toggleClass("dim", src.hasClass("dim") || tgt.hasClass("dim"));
    });
  });

  document.getElementById("filter-type").addEventListener("change", (e) => {
    const t = e.target.value;
    if (!t) {
      cy.elements().removeClass("dim");
      return;
    }
    cy.nodes().forEach((n) => {
      n.toggleClass("dim", n.data("type") !== t);
    });
    cy.edges().forEach((edge) => {
      edge.toggleClass("dim", edge.source().hasClass("dim") || edge.target().hasClass("dim"));
    });
  });

  function clearSelection() {
    cy.elements().unselect();
    document.getElementById("detail-empty").hidden = false;
    document.getElementById("detail-content").hidden = true;
  }

  function showDetail(conceptId) {
    const data = nodeIndex[conceptId];
    if (!data) return;
    cy.elements().unselect();
    const node = cy.getElementById(conceptId);
    if (node) node.select();

    document.getElementById("detail-empty").hidden = true;
    const content = document.getElementById("detail-content");
    content.hidden = false;

    const chip = document.getElementById("detail-type");
    chip.textContent = data.type;
    chip.style.background = data.color;

    document.getElementById("detail-title").textContent = data.label;
    document.getElementById("detail-id").textContent = conceptId;
    document.getElementById("detail-description").textContent = data.description || "—";

    const resourceEl = document.getElementById("detail-resource");
    resourceEl.innerHTML = "";
    if (data.resource) {
      const a = document.createElement("a");
      a.href = data.resource;
      a.textContent = data.resource;
      a.target = "_blank";
      a.rel = "noopener";
      a.className = "external";
      resourceEl.appendChild(a);
    } else {
      resourceEl.textContent = "—";
    }

    const tagsEl = document.getElementById("detail-tags");
    tagsEl.innerHTML = "";
    if (data.tags && data.tags.length) {
      for (const t of data.tags) {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = t;
        tagsEl.appendChild(span);
      }
    } else {
      tagsEl.textContent = "—";
    }

    const body = bundle.bodies[conceptId] || "";
    const html = marked.parse(body, { breaks: false, gfm: true });
    const bodyEl = document.getElementById("detail-body");
    bodyEl.innerHTML = html;
    rewriteInternalLinks(bodyEl);

    const bl = backlinks[conceptId] || [];
    const blSection = document.getElementById("detail-backlinks");
    const blList = document.getElementById("backlinks-list");
    blList.innerHTML = "";
    if (bl.length) {
      blSection.hidden = false;
      for (const src of bl) {
        const li = document.createElement("li");
        const a = document.createElement("a");
        a.textContent = nodeIndex[src]?.label || src;
        a.dataset.target = src;
        a.addEventListener("click", () => showDetail(src));
        li.appendChild(a);
        const muted = document.createElement("span");
        muted.className = "muted";
        muted.textContent = ` (${src})`;
        li.appendChild(muted);
        blList.appendChild(li);
      }
    } else {
      blSection.hidden = true;
    }

    cy.animate({ center: { eles: node }, zoom: Math.max(cy.zoom(), 1.0) }, { duration: 200 });
  }

  function rewriteInternalLinks(root) {
    root.querySelectorAll("a[href]").forEach((a) => {
      const href = a.getAttribute("href");
      if (!href) return;
      if (href.startsWith("/") && href.endsWith(".md")) {
        const target = href.slice(1, -3);
        if (nodeIndex[target]) {
          a.className = "internal";
          a.setAttribute("href", "javascript:void(0)");
          a.addEventListener("click", (e) => {
            e.preventDefault();
            showDetail(target);
          });
          return;
        }
      }
      a.className = "external";
      a.setAttribute("target", "_blank");
      a.setAttribute("rel", "noopener");
    });
  }

  // Show the most-linked node first
  const initial =
    bundle.nodes.find((n) => n.data.id === bundle.root) ||
    bundle.nodes[0];
  if (initial) showDetail(initial.data.id);
})();

</script>
