s/leanrea_eval/rules": "# Procedural Rules: Gauntlet D — leanrea Zero-MCP Reverse Engineering\n\n> 1. **Step 1 — Magic-Byte & Target Routing (aicodeking/leanrea Router)**:\n   * Run `file -b <target>` and `head -c 16 <target> | xxd` on the working copy to classify the artifact before choosing tools.\n> 2. **Step 2 — One-Shot First-Move Inventory**:\n   * **ELF / Native .node Addon (Linux ws-hermes)**: Execute `readelf -h -d -W <bin> && nm -D --defined-only <bin> && objdump -d -M intel <bin> | grep -E \"<.*>:|call\"` in a single shell turn.\n   * **Go Binary**: Execute `go version -m <bin>` and `strings <bin> | rg -uu \"go1\\.|github\\.com/\"`.\n   * **Electron / asar Archive**: Execute `npx --yes @electron/asar extract <archive.asar> output/work_copy/asar_extracted && rg -uu -n \"ipcMain|contextBridge|preload|socket\" output/work_copy/asar_extracted`.\n   * **SQLite / Embedded DB**: Execute `sqlite3 -readonly <db> \".schema\" \".tables\"`.\n> 3. **Step 3 — Call-Sequence & Literal Tracing**:\n   * Trace string literals to cross-referenced functions via `objdump -d` / `readelf -x .rodata` rather than reading every assembly instruction linearly.\n> 4. **Step 4 — Evidence Serialization**:\n   * Write `output/recon_evidence.json` containing `{\"claims\": [{\"id\": \"...\", \"claim\": \"...\", \"epistemic_status\": \"seen|inferred|unknown\", \"evidence_cmd\": \"...\"}]}` and validate with `bash ./contract.sh`.\n", "benchmarks/markitdown_eval/CONTEXT": "# Stage Contract: Gauntlet G — microsoft/markitdown Document Ingestion\n\n## Inputs\n* Workspace Root Map: ../../AGENTS.md\n* Installed Skill: ~/.hermes/skills/markitdown/SKILL.md\n* Hard Operational & Security Bounds: ./invariants.md\n* Format Conversion Heuristics: ./rules.md\n* microsoft/markitdown CLI & Python API Schemas: ./references.md\n\n## Process\n> 1. Read ./invariants.md, ./rules.md, and ./references.md.\n> 2. Generate multi-format local document fixtures inside output/fixtures/ (substrate_report.html, vram_ledger.csv, and phase55_summary.docx) containing structured headings, tables, and bulleted invariants.\n> 3. Convert each fixture into clean GitHub-Flavored Markdown inside output/ingested/ using both the markitdown CLI (markitdown <input> -o <output.md>) and the targeted Python API (MarkItDown(enable_plugins=False).convert_local()).\n> 4. Consolidate the ingested Layer 3 reference digest into output/ingested/consolidated_digest.md and run bash ./contract.sh.\n\n## Outputs\n* Ingested Markdown Files: output/ingested/*.md\n* Verification Receipt: output/status.json\n\n## Verify\n* Run bash ./contract.sh and confirm exit code 0.\n", "benchmarks/markitdown_eval/invariants": "# Hard Invariants: Gauntlet G — microsoft/markitdown Document Ingestion\n\n> 1. **100% Offline Local Conversion (convert_local)**: Never configure Azure Document Intelligence (docintel_endpoint), Azure Content Understanding (--use-cu), or remote OpenAI clients. All conversions MUST execute 100% locally inside ws-hermes.\n> 2. **Third-Party Plugins Disabled by Default**: Always instantiate MarkItDown(enable_plugins=False) and never pass --use-plugins unless explicitly requested by a human gate.\n> 3. **Restricted Input Surface**: In Python code, always call md.convert_local(filepath) rather than permissive md.convert(uri) to prevent SSRF or unintended network fetches (microsoft/markitdown Security Rule).\n> 4. **Structural GFM Preservation**: Converted Markdown outputs MUST preserve # heading hierarchies and pipe | ... | table structures with zero raw binary garbage or unclosed code blocks.\n> 5. **Context Budget Discipline**: Never dump raw multi-megabyte documents into active context; inspect converted .md headers and table summaries selectively within the 2,000–8,000 token stage budget.\n", "benchmarks/markitdown_eval/output/ingested/consolidated_digest": "# Consolidated Substrate Digest\n* Active VRAM: 4303 MiB (Ceiling: 5800 MiB)\n* Decoding Speed: 38.83 t/s\n", "benchmarks/markitdown_eval/output/ingested/substrate_report": "# Hermes Substrate Report\n\nCanonical v45 Substrate and Hardware VRAM Ledger\n\n| Metric | Configured Value | Ceiling |\n| --- | --- | --- |\n| Active VRAM | 4303 MiB | 5800 MiB |\n| Inference Throughput | 38.83 t/s | 60.00 t/s |", "benchmarks/markitdown_eval/references": "# Layer 3 Reference Schemas: Gauntlet G (microsoft/markitdown)\n\n## 1. Upstream Repository & Supported Formats\n* **Source**: https://github.com/microsoft/markitdown (Python 3.10–3.14, pip install 'markitdown[all]')\n* **Supported Local Formats**: PDF (.pdf), Word (.docx), Excel (.xlsx, .xls), PowerPoint (.pptx), HTML (.html), Text (CSV, JSON, XML), ZIP archives (.zip), EPubs (.epub), Images (EXIF), Audio (EXIF/local transcription).\n\n## 2. Canonical CLI Syntax\n* **Direct File-to-File Conversion**: `markitdown output/fixtures/substrate_report.html -o output/ingested/substrate_report.md`\n* **Standard Input Pipe Conversion**: `cat output/fixtures/substrate_report.html | markitdown > output/ingested/substrate_report.md`\n\n## 3. Canonical Python API (convert_local Security Pattern)\n```python\nfrom markitdown import MarkItDown\n\nmd = MarkItDown(enable_plugins=False)\nresult = md.convert_local(\"output/fixtures/substrate_report.html\")\nwith open(\"output/ingested/substrate_report.md\", \"w\", encoding=\"utf-8\") as f:\n    f.write(result.markdown)\n```\n", "benchmarks/markitdown_eval/rules": "# Procedural Rules: Gauntlet G — microsoft/markitdown Document Ingestion\n\n> 1. **Step 1 — Fixture Preparation (output/fixtures/)**:\n   * Create deterministic multi-format test fixtures (output/fixtures/substrate_report.html, output/fixtures/vram_ledger.csv, and output/fixtures/phase55_summary.docx) containing known ground-truth headings (# Hermes Substrate Report) and tabular metrics (4303, 5800, 38.83).\n> 2. **Step 2 — CLI & Python API Conversion (output/ingested/)**:\n   * Execute markitdown output/fixtures/substrate_report.html -o output/ingested/substrate_report.md.\n   * Execute Python MarkItDown(enable_plugins=False).convert_local() on all remaining fixtures and write .markdown to output/ingested/.\n> 3. **Step 3 — Post-Ingestion Normalization**:\n   * Verify that every output .md file is non-empty, UTF-8 encoded, contains preserved markdown tables (|), and passes bash ./contract.sh.\n", "benchmarks/tau_bench/CONTEXT": "# Benchmark Contract: Sierra Research Tau-Bench Suite (tau_bench)\n\n> **Role**: Layer B Evaluation Contract (Retail & Airline Multi-Turn Environments).  \n> **Line Discipline**: Strictly $\\le 80$ lines.\n\n---\n\n## 1. Inputs & Routing\n| Input Source | File / Location | Scope |\n| :--- | :--- | :--- |\n| Environment | `tau_bench.envs.retail` | Retail customer service simulation |\n| Agent Endpoint | Port 8642 (`http://127.0.0.1:8642/v1`) | Hermes Agent gateway (`_run_agent`) |\n| Customer Endpoint | Port 20128 (`http://127.0.0.1:20128/v1`) | OmniRoute isolated proxy simulator |\n\n## 2. Process\n> 1. Launch OmniRoute daemon on Port 20128 and Hermes Gateway on Port 8642.\n> 2. Execute `tau_bench.run` with `--agent-strategy react` (`ChatReActAgent`).\n> 3. Enforce sanitization of `provider_specific_fields` to prevent 422 Unprocessable Entity errors.\n> 4. Record raw trajectories and action histories to `output/`.\n\n## 3. Outputs\n| Artifact | Location | Format |\n| :--- | :--- | :--- |\n| Evaluation Logs | `benchmarks/tau_bench/output/eval_results.json` | JSON trajectory ledger |\n| Metrics Summary | `benchmarks/tau_bench/output/metrics.md` | Success rate & cost |\n\n## 4. Verify\n* [ ] Dual-port isolation enforced (Port 8642 vs Port 20128).\n* [ ] LiteLLM registers models at zero cost (`$0.0`).\n* [ ] Zero 422 validation rejections from LiteLLM proxy.\n", "benchmarks/tau_bench/invariants": "# Benchmark Invariants (Layer 2)\n\n> Line Cap: <= 80 lines\n\n1. **Normalized Output**: Evaluate cold; emit normalized final integer/string without conversational prefixes.\n2. **Context Horizon**: Do not exceed 8,000 tokens per evaluation turn.\n3. **Hardware Ceiling**: GPU VRAM <= 5,800.0 MiB on discrete RTX 3050.\n", "benchmarks/tau_bench/references": "# Benchmark References (Layer 3)\n\n> Line Cap: <= 200 lines\n\n1. **Benchmark Ground-Truth**: GAIA Level 1 Sample 0 ground truth integer 17000 (Moon perigee marathon pace).\n2. **Substrate Routing**: Local Candidate 3 inference on Port 8138.\n3. **Deterministic Evaluation**: AST and regular expression verification gates.\n", "benchmarks/tau_bench/rules": "# Benchmark Rules (Layer 2)\n\n> Line Cap: <= 120 lines\n\n1. **Ground-Truth Preservation**: Compare results directly with ground-truth test vectors.\n2. **Cold Determinism**: Run evaluations in isolated sessions without leaking prior turn state.\n3. **Receipt Generation**: Write pass/fail telemetry to `output/status.json`.\n", "shared/netcode_protocol": "# Shared Reference: Multiplayer Netcode Protocol (Gauntlet A)\n\n## Protocol Invariants\n- Transport: WebSocket on Port 8080.\n- Broadcast Frequency: 20 Hz fixed tick loop (50 ms interval).\n- Client Packet Schema: Supports `data.type || data.t`.\n- Handshake Sequence: Server sends `join` / `WELCOME` on connection with client ID.\n- Position Broadcast: Serialized x, y, z positions with interpolation.\n- Voxel Splat Broadcast: Position, color hex, and voxel mutation type.\n", "shared/shader_conventions": "# Shared Reference: Shader & Buoyancy Conventions (Gauntlet C)\n\n## Three.js Shader Invariants\n- Library Version: Three.js `three@0.165.0`.\n- ShaderMaterial Uniforms Property: Strictly plural `uniforms: { ... }`. Singular `uniform:` is invalid.\n- Water GPGPU: Dual framebuffer wave PDE ping-pong on floating-point textures.\n- Caustics Shader: Differential area mapping using dFdx/dFdy.\n- Buoyancy Physics: Clamped spherical-cap volume integration with drag damping.\n", "shared/vision_schemas": "# Shared Reference: Vision and Centroid Schemas (Gauntlet B)\n\n## Vision Invariants\n- Target Canvas: `#gameCanvas` at 1280x720 CSS pixels.\n- High-DPI Scale Ratio: `canvas.width / rect.width` and `canvas.height / rect.height`.\n- Aiming Algorithm: OpenCV CPU `cv2.HoughCircles` detection (dp=1.2, minDist=30, param1=50, param2=30).\n- Latency Constraint: < 5 ms frame latency on CPU (0 MiB GPU VRAM).\n- Precision Constraint: < 5 px aiming error relative to target center.\n- Telemetry Schema: JSON with `frames_captured`, `score`, `elapsed_s`, and `vram_mib`.\n", "skills/icm-architect/README": "# icm-architect\n\nAn agent skill that designs any process, idea, or problem into an **ICM workspace** (folder structure as agent architecture), or restructures an existing folder, repo, or vault into one. It follows the open [Agent Skills](https://agentskills.io) format, so it works in any agent that reads `SKILL.md` (Codex, Gemini CLI, Hermes Agent, Claude Code, Cursor, GitHub Copilot and others) and in any model you hand the folder to.\n\nICM (Interpretable Context Methodology) replaces orchestration code with structure: numbered folders carry sequencing, hierarchy carries context scoping, plain markdown files carry state. One agent, reading the right files at the right moment, does the work of a multi-agent framework, and a person can open any folder and see what state the system is in.\n\n- Paper: [Interpretable Context Methodology: Folder Structure as Agent Architecture](https://arxiv.org/abs/2603.16021) (Van Clief & McDermott)\n- Community: [Clief Notes](https://www.skool.com/cliefnotes)\n\n## What it does\n\nTwo modes:\n\n- **Build**: extracts the structure already present in how you describe your work (the stages, the checks, what's stable vs. per-run), picks a form, and scaffolds the smallest workspace that carries it.\n- **Restructure**: audits an existing folder, classifies every file (catalog / contract / factory / product / dead), finds what points at each one, proposes a migration map for approval, then migrates and validates.\n\nEvery ICM is built from three primitives: a **sequence** (numbered steps, each one's output the next one's input), a **shelf** (a folder of same-shaped files), and a **catalog** (a small file that points down). The forms are recipes over them: **Pipeline**, **Record library**, **Knowledge bundle** (including one built from transcripts and research, with every quote checked against its source), **Context map**, and **System map**. They nest.\n\nEvery step ends at a **check** (a person, a script, or a small model) so a wrong turn is caught before the next step amplifies it. Every result is validated with the **walk test**: an agent with no memory must orient, act, and report status from the files alone.\n\nThe workspaces it builds are plain folders and markdown with `AGENTS.md` as the entry file, the name most agents read by default; tools that look for another name get a one-line pointer to it. Nothing in a workspace depends on one vendor.\n\n## Install\n\nKeep the folder named `icm-architect`: a skill's name must match its folder.\n\n| Agent | Put the `icm-architect/` folder in |\n|---|---|\n| Codex | `~/.agents/skills/` (all projects) or `.agents/skills/` in a repo |\n| Gemini CLI | `~/.gemini/skills/` or `~/.agents/skills/`, or install it with `gemini skills install` and this repo's Git URL |\n| Hermes Agent | `~/.hermes/skills/`, or list `~/.agents/skills` under `skills.external_dirs` in its config |\n| Claude Code | `~/.claude/skills/` or `.claude/skills/` in a project |\n| Claude apps | zip the folder (the folder itself is the zip root) and upload it under Customize → Skills |\n| Cursor, GitHub Copilot and other Agent Skills clients | that client's skills folder |\n| Any other agent or model | give it the folder and say \"use this skill\", or paste `SKILL.md` and then each file it points you to |\n\nOne copy in `~/.agents/skills/` serves Codex and Gemini CLI, and Hermes can be pointed at it.\n\nThen ask your agent to \"ICM this\", \"structure this for agents\", or \"build me a workspace for X\".\n\n## What's inside\n\n- `SKILL.md`: the method. Load it first; it routes to the rest.\n- `references/`: the detail, read only when a step needs it.\n- `assets/templates/`: blank starters a workspace copies.\n- `scripts/`: optional standard-library Python 3 that a workspace copies into `_tools/`. They check that links and input paths resolve, draw a workspace (or several) as one interactive graph, generate indexes, and check quotes against their sources. An agent without a shell can skip them.\n\nMIT licensed, like the protocol it serves.\n", "skills/icm-architect/SKILL": "# ICM Architect\n\nBuild workspaces where the folder structure does the orchestration. One agent, reading the right files at the right moment, replaces a multi-agent framework: numbered folders carry sequencing, hierarchy carries context scoping, plain markdown files carry state. A person can open any folder and see what state the system is in, because state is just files. The routing files are the catalog: small and stable, they point at the shelves where the content lives.\n\nMethod: Interpretable Context Methodology (Van Clief & McDermott, arXiv:2603.16021, MIT-licensed). It runs in any agent or model that can read files: nothing in a workspace depends on one vendor's tools.\n\n## The invariants\n\nEvery ICM starts from these ten. They are defaults: when you know what works and need a nuanced change, break one on purpose and write why in the nearest `CONTEXT.md` or `AGENTS.md`.\n\n1. **One folder, one job** (Unix, Parnas). Each folder does a single step or holds a single kind of thing, and states its own purpose in a file inside itself. The structure is the documentation.\n2. **A small, stable entry file.** `AGENTS.md` at the root answers \"where am I, where does everything live, where do I go for task X\" and nothing else. Under ~60 lines; it routes and never holds content. A tool that looks for another file name gets a one-line pointer to it, never a second copy (see [references/core.md](/skills/icm-architect/references/core.md), Naming).\n3. **Numbering encodes order.** `01_`, `02_`, ... where sequence matters.\n4. **Every working folder has a contract.** A `CONTEXT.md`: what it reads (inputs), what it does (process), what it writes (outputs), how it is checked. See [assets/templates/stage-CONTEXT.md](/skills/icm-architect/assets/templates/stage-CONTEXT.md).\n5. **Factory vs. product** (continuous delivery). Reference material (rules, voice, schemas, templates: stable across runs) lives apart from working artifacts (outputs, drafts: new every run), because they ask different things of the model: references constrain, inputs are worked on. Configure the factory once; the product is what each run emits.\n6. **Every step ends at a check** (Horvitz, Shneiderman). Each output is a plain file a person can open, edit and save. Nothing moves on until it passes the check its stage names under `## Check`: a person, a script, or a small model. A check that isn't a person writes `check.md` beside the output, first line `pass` or `fail: <why>`; a fail stops the run there. The stop is the point: a wrong turn caught here is not amplified downstream.\n7. **Load only what the step needs.** A step reads its contract, its references and its inputs, never the whole workspace: under about 8,000 tokens. Prevent, don't compress.\n8. **Plain text, linkable, queryable** (Kernighan, Pike). Markdown + YAML frontmatter. Links make it a graph; frontmatter labels make it queryable. One home per fact; a link beats a copy. Links and input paths are relative and must resolve; wikilinks only in a declared Obsidian vault. The first heading names the file and its job, so `grep -rm1 '^# ' .` lists any tree.\n9. **Status lives on disk:** what exists, or one status line in the file it describes. Generated indexes (`_index.md`, file maps) are rebuilt by script, never hand-edited.\n10. **Instantiate by copying.** A new unit of work is a copy of a template, not a blank page. Templates live in `_templates/`, scripts in `_tools/`.\n\n## Choose a mode\n\n- **Build**: from a described process, idea, or problem.\n- **Restructure**: an existing folder, repo, or vault that needs ICM structure.\n\nSome forms bring their own pipeline (System map; Knowledge bundle from sources). Their reference says which steps it replaces.\n\n## Three primitives\n\nEvery ICM is built from three things:\n\n- **Sequence**: numbered folders; each step's `output/` is the next step's input.\n- **Shelf**: a folder of same-shaped files, each copied from one template.\n- **Catalog**: a small file that points down and stores no content: `AGENTS.md`, a `CONTEXT.md`, a generated index or graph.\n\nThe forms below are recipes over these. Nest them freely; each level keeps its own small catalog that links down and stops. An Umbrella is one catalog over several pipelines, with their shared shelf at the root. When no form fits, build from the three and name the recipe in the entry file.\n\n## Build mode\n\n**1. Extract the structure from dialogue.** The structure is already in how the person describes the work: surface theirs, don't impose one. Ask, a few at a time:\n\n- What is the repeating unit of work? (an episode, a client, a report, a person, a team?)\n- Walk me through one run, start to finish. Where do you stop and check something before continuing?\n- What stays the same every run (voice, rules, brand, schema) vs. what is new every run?\n- What does \"done\" look like: what artifact leaves the workspace?\n- Who else touches this, and what do they need to find without asking you?\n\nTheir pauses become stage boundaries. Their \"I always check X before Y\" become checks. Their \"it always has to sound like / follow Z\" becomes factory reference material.\n\n**2. Pick the form.** Read [references/forms.md](/skills/icm-architect/references/forms.md) and choose:\n\n| Form | Built from | Reach for it when |\n|---|---|---|\n| **Pipeline** | a sequence | the same steps run again, a deliverable each run |\n| **Record library** | a shelf of records with a status line each | the unit is a record that accumulates (person, client, session) |\n| **Knowledge bundle** | shelves of linked notes, often filled by a sequence from sources | the product is the knowledge: how someone thinks, or the ideas an artifact will be built from |\n| **Context map** | shelves of teams, processes and data, linked by `consumes:` / `produces:` | the subject is an organization |\n| **System map** | shelves of nouns and verbs plus an impact index, filled by a gated sequence | a tree later agents will edit |\n\n**3. Scaffold the smallest structure that carries the work.** Copy starters from [assets/templates/](../../skills/icm-architect/assets/templates) and the scripts you need from [scripts/](../../skills/icm-architect/scripts) into `_tools/`. Do not create folders for stages that don't exist yet, empty \"misc\" buckets, or speculative depth. Three real stages beat seven imagined ones. If the whole job fits in one saved prompt, say so and don't build a workspace at all.\n\n**4. Write the contracts.** Root `AGENTS.md` (identity + routing table, from `assets/templates/entry.md`), plus the one-line pointer for each agent the owner uses that reads another name, always including the one you are running in ([references/core.md](/skills/icm-architect/references/core.md), Naming); root `CONTEXT.md` (the pipeline or schema), one `CONTEXT.md` per working folder, `setup/questionnaire.md` if the factory needs configuring per user. Inputs are exact backticked paths, split into working (this run) and reference (every run).\n\n**5. Validate with the walk test** (below).\n\n## Restructure mode\n\n**1. Inventory before touching.** List the tree. For each area note what it is, when it was last touched, and what refers to it. Never delete or move in this pass.\n\n**2. Find the hidden form.** Ask the owner (or infer and confirm): what is the repeating unit here? Where does work enter and leave? The mess usually contains a real pipeline, library, or map that grew without a skeleton: extract it, don't replace it.\n\n**3. Classify every file** into one of five roles:\n- **Catalog**: identity and routing (becomes or feeds `AGENTS.md` and index files; an existing `CLAUDE.md`, `GEMINI.md` or similar becomes a one-line pointer once its content has a home in `AGENTS.md` or a shelf, at step 6)\n- **Contract**: how a step works (becomes a `CONTEXT.md`)\n- **Factory**: stable reference (goes to `_shared/`)\n- **Product**: run-specific artifacts (goes to a stage's `output/` or a record folder)\n- **Dead**: stale, duplicated, or superseded (propose `_archive/`, never delete), and only once step 4 finds nothing that depends on it\n\n**4. Find what points at each file before proposing a move.** Apparent disuse is not proof. Check links inside the workspace, sibling `../` paths, symlinks, and consumers outside it: other repos, configs, scheduled jobs, agent configs that hardcode a path. Nothing in the tree names the outside consumers, so ask the owner. A file with a live referrer is held, or moved only if every referrer is updated in the same change.\n\n**5. Propose before moving.** Present the target tree and a migration map (old path, new path, role, referrers found). Get approval against step 4's findings. This is a check in a method built on checks: honor it.\n\n**6. Migrate: copy, verify, then remove.** Confirm the workspace is tracked or backed up first. Before any copy or rename, check whether the destination already exists case-folded: on Windows and macOS, renaming a file to `CONTEXT.md` silently overwrites an existing `context.md`, and a file inventory will not show the collision; surface every hit at the approval gate. Copy to the new home, verify parity (file count and content hash; for zipped office formats, compare the unzipped content), then remove the original, leaving a link where anything referred to it. Write the entry file and contracts, and dedupe toward one home per fact. If the structure will be reused, keep the blank template apart from this filled-in deployment.\n\n**7. Validate with the walk test.**\n\n## The walk test\n\nWalk it cold, as an agent with no memory:\n\n- Open the root. Can you answer *where am I* and *where do I go for the current task* within the entry file plus at most two more reads?\n- Pick any working folder. Does its contract name exact input paths, the job, the output, and the check?\n- Can you state status purely from what exists on disk, including any `check.md` verdicts?\n- Is any routing file carrying content? Move it to a shelf; leave a pointer.\n- Is any fact stored in two places? Pick one home; link from the other.\n- Does `python -I _tools/links.py` pass (or, with no Python, does every link you follow resolve)? After a restructure, it shows every link and contract input inside the tree still resolves; consumers outside it are the owner's list from step 4.\n- Does one contract plus its inputs stay under about 8,000 tokens?\n- Is every broken invariant explained where it breaks?\n\nThen run the form's own checks, in its reference. If a step fails, fix the structure, not by explaining more but by moving or splitting files until the walk works.\n\n## Guardrails\n\n- **Don't over-structure.** The ladder runs: chat, then a saved prompt or skill, then folders and one agent. Only climb when the rung below is genuinely automated and repeating. A workspace for a thing done twice is scaffolding, not architecture.\n- **Let it harden.** A step that is code names its command, run from the workspace root, e.g. `` 3. Run `python _tools/count_rows.py stages/03_tally/output/rows.csv` ``: the command is the step. A stage may keep `examples/`, one real input and one good output from a run you liked, listed under Inputs. In a working ICM, fold a stage nobody edits, script a check that never fails, and split a contract that keeps growing.\n- **Know where ICM loses.** Real-time multi-agent collaboration, high-concurrency multi-user serving, and automated mid-pipeline branching genuinely need framework code. ICM is for sequential, checked, repeatable work: most knowledge work, but not all of it.\n\n## References\n\n- [references/core.md](/skills/icm-architect/references/core.md): the five-layer context hierarchy, the contract format, naming, library rules. Read when writing contracts or when a structural call is contested.\n- [references/forms.md](/skills/icm-architect/references/forms.md): the five forms in depth: skeletons, moves, failure modes. Read at step 2 of Build or Restructure.\n- [references/system-map.md](/skills/icm-architect/references/system-map.md): the audit pipeline for a System map. Read when that form is chosen.\n- [references/bundle-from-sources.md](/skills/icm-architect/references/bundle-from-sources.md): building a Knowledge bundle from transcripts, interviews or research, with every quote checked. Read when that variant is chosen.\n- [assets/templates/](../../skills/icm-architect/assets/templates): copyable starters. Any form: `entry.md` (copied to the root as `AGENTS.md`), `CONTEXT.md`, `stage-CONTEXT.md`, `questionnaire.md`. Context map: `context-map-node.md`, `context-map-schema.md`. System map: `object.md`, `process.md`. Bundle from sources: `concept.md`, `source.md`, `plan.md`, `claim.md`, `bundle-schema.md`, `keep-out.txt`.\n- [scripts/](../../skills/icm-architect/scripts): optional standard-library Python, copied into a workspace's `_tools/`. `links.py` checks that links and input paths resolve (`--graph` also writes the graph); `viz.py` draws one or more graphs as `viz.html`; `index.py` writes `_index.md` from the notes; `quotes.py` checks quotes against their sources and keeps keep-out phrases out.\n", "skills/icm-architect/assets/templates/CONTEXT": "# {Workspace name} - the pipeline\n\nThe flow in one line: {plan it, make it, check it, ship it, in your workspace's words}.\n\n| Stage | Job |\n|---|---|\n| `01_{name}` | {five words} |\n| `02_{name}` | {five words} |\n| `03_{name}` | {five words} |\n\nEach stage's own `CONTEXT.md` holds its inputs, outputs and check.\n\nFactory (stable, every run): `_shared/{voice.md, rules.md, ...}`\nProduct (new each run): each stage's `output/`\n\nStatus is whatever exists: a stage is complete when its `output/` holds an artifact and any `check.md` there says pass. A placeholder that only keeps the empty folder in git does not count.\n", "skills/icm-architect/assets/templates/bundle-schema": "# Schema - the rules of this bundle\n\nThe closed set of note types, how quotes are cited, and what may never appear. When practice and this file disagree, reconcile the same day.\n\ntypes: concept, plan, source, claim\n\nAdd `ask`, `story` or `reading` to this list only when someone will query them.\n\n## Note types\n\n| `type:` | Lives at | Carries |\n|---|---|---|\n| source | `sources/<slug>.md` | how to cite, errors and fixes, gaps, what stays out |\n| concept | `concepts/<slug>.md` | one idea, the speaker's words, where it stops |\n| plan | `plans/<slug>.md` | one artifact's route through the concepts |\n| claim | `claims/<slug>.md` | claims to verify, lines to rework |\n\nEvery note's first heading is its title. A planned note that is not written yet is a stub: its frontmatter (`status: stub`, a one-line description) and its title. Links to it resolve from the first batch, and `_index.md` shows it as a stub until it is filled.\n\n## Citations\n\n`\"verbatim line\" (key position)`. The key is the raw file's name without its extension, or a short name declared in `_meta/sources.txt` as `key = filename`. Position for a transcript is `mm:ss` or `h:mm:ss` (or a range, `12:30-13:05`); cite the timestamp that opens the paragraph. Position for a document is a page (`page 2`, `pp 4-5`); a document with `Page 1`, `Page 2` lines is checked by page, and any other document is matched anywhere. Paraphrase takes no quote marks. To keep a name out of a quote, cut it with `...`; never swap a word inside the marks. `_tools/quotes.py` checks every quote.\n\n## Privacy\n\nPeople are described by role, never named, in every note, with neutral pronouns unless the source states them. Phrases that must never appear go in `_meta/keep-out.txt`, one per line; `_tools/quotes.py` fails on a whole-word hit anywhere outside `sources/raw/` and `_meta/`, so list each form of a word. Keep that file out of anything that is published.\n\n## Naming\n\nSlugs are kebab-case. One idea per file, and the filename is the idea. Each shelf has a `CONTEXT.md` (its contract) and an `_index.md` written by `_tools/index.py`.\n", "skills/icm-architect/assets/templates/claim": "# {Claims to check before they are said}\n\nHow this was checked, and when: {date; which tools. A search summary is a lead, not a source.}\n\nStatus words: **verified** (a primary source is named) · **speaker's account** (true as their experience, not an outside fact) · **not checked** (hold it out as a fact) · **needs the speaker** (a gap only they can close).\n\n## 1. {The claim, in a few words}\n\n- \"{the speaker's words, verbatim}\" ({key} {position})\n\nLeans on: [{concept}](../concepts/{slug}.md).\nChecked: {how, when, against what. Or: not checked, and why.}\nStatus: {one status word}.\nSafe version: {the line a script can say.}\n", "skills/icm-architect/assets/templates/concept": "# {The idea, named the way the speaker says it}\n\n{The idea, stated once, in two or three sentences.}\n\n## In their words\n\n- \"{verbatim line, trimmed to the clean part}\" ({key} {position})\n- \"{verbatim line}\" ({key} {position})\n\n## Where it stops\n\n- {The speaker's own limits, hedges and exceptions, in their terms.}\n\n## Note\n\n{Your reading, marked as a proposal. Delete this section if you have none.}\n\n## Related\n\n- [{other idea}]({slug}.md), [{plan that uses it}](../plans/{slug}.md)\n", "skills/icm-architect/assets/templates/context-map-node": "# {Process name}\n\n## Input → Movement → Output\n{What comes in, what the team does to it, what goes out. Three sentences.}\n\n## Now\n{How it actually runs today, at the ai-level declared above.}\n\n## What is working / not working\n{Honest, from the people who run it.}\n\n## If we structure this\n{What the AI-assisted version looks like — left as a stub until it's real.}\n\n## What the human keeps checking\n{The judgment that stays with a person no matter how automated this gets.}\n", "skills/icm-architect/assets/templates/context-map-schema": "# Schema — the rules of this workspace\n\nThe closed set of note types, the labels they carry, and the naming they follow. When practice and this file disagree, reconcile the same day — schema drift is how structures rot.\n\n## Node types\n\n| `type:` | Lives at | Carries |\n|---|---|---|\n| team | `teams/<slug>/{Team Name}.md` | In / Movement / Out / Edges |\n| process | `teams/<slug>/processes/<slug>.md` | full scoring frontmatter (see `context-map-node.md`) |\n| job | `teams/<slug>/jobs/<slug>.md` | the outcome, who owns it |\n| data-asset | `teams/<slug>/data/data-<thing>.md` | source of truth, shape, sensitivity |\n| governance | `teams/<slug>/governance.md` | what may not be automated, and why |\n| pattern | `patterns/<slug>.md` | only after 3+ independent occurrences |\n\n## Labels that make it queryable\n\n`type`, `team`, `owner`, `ai-level` (L0–L3), `value` (1–5), `pain` (1–5), `governance` (internal / sensitive / external). `consumes:` and `produces:` link to data assets, and the links draw the map on their own. They are wikilinks only if this map is an Obsidian vault; say so here. value + pain ≥ 8 flags a pilot candidate.\n\n## Naming\n\n- Slugs: kebab-case. Data assets always `data-<thing>.md`.\n- Human-browsed cards may use Title Case filenames — but declare that choice here and hold it everywhere.\n- `_meta/` holds the rules (this file). Generated indexes are rebuilt by script, never hand-edited.\n", "skills/icm-architect/assets/templates/entry": "# {Workspace name}\n\n{One sentence: what this workspace is and what leaves it.}\n\n## Where things live\n\n| Folder | What it holds |\n|---|---|\n| `stages/` | the pipeline, in execution order |\n| `_shared/` | factory: rules and reference that never change per run |\n| `_templates/` | blank starters: new work is a copy, not a blank page |\n| `_tools/` | scripts the stages call; `links.py` checks every link and input path |\n| `setup/` | one-time factory configuration |\n\n## Route by what just happened\n\n| If | Go to | Then stop at |\n|---|---|---|\n| starting a new run | [01_{name}](stages/01_{name}/CONTEXT.md) | the stage's check |\n| {previous stage} passed its check | next numbered stage | the stage's check |\n| asked for status | scan `stages/*/output/` and any `check.md` | report what exists |\n| setting up for a new user | [questionnaire](/skills/icm-architect/assets/templates/questionnaire.md) | answers written to `_shared/` |\n\n## The one rule\n\nNothing moves to the next stage until the last one's check passes.\n", "skills/icm-architect/assets/templates/object": "# {Name}\n\n{One sentence. If the product word and the file/type name differ, say both.}\n\n## Why this shape\n\n{The load-bearing why, not a field tour.}\n\n## Shape\n\n- {keys, constraints, or owning files}\n\nCitations: `{path}:{line}`\n\n## Connected to\n\n- **owns:**\n- **owned-by:**\n- **joins:**\n- **looks-like-but-is-not:**\n\n## If you change this\n\n- **Hits:**\n- **Does not hit:**\n\n## Surfaces\n\n| Surface | Role |\n|---|---|\n| {who} | {reads / writes / none} |\n\n## See\n\n- Source: `{path}`\n", "skills/icm-architect/assets/templates/plan": "# {The artifact: a lecture, a script, a doc set}\n\n**Arrives with:** {the reader's question, in their words. If the sources are the speaker's and not the audience's, write it as an assumption and list the audience's own words under Open.}\n**One idea:** {the single thing this artifact says}\n**Leaves able to:** {one observable thing}\n**Needs:** {what the reader should already have}\n\n## Orientation (draft)\n\n{Two sentences: which artifact this is, what you need, what you will leave with. Before any hook.}\n\n## Spine\n\n1. [{concept}](../concepts/{slug}.md): {why it comes here; full treatment or a line}\n2. [{concept}](../concepts/{slug}.md): {why it comes here; full treatment or a line}\n\n## The speaker's best lines\n\n- \"{verbatim, copied from a concept}\" ({key} {position})\n\n## Real thing to show\n\n{The actual page, file, screen or example. If it is not in the sources, list what to ask for.}\n\n## Claims to check before saying it\n\n- [{claims file}](../claims/{slug}.md), items {n}\n\n## Open\n\nIf the speaker and the author are the same person, keep one list.\n\nFor the speaker (only they can answer):\n\n- {a story they have not told, a number they have not given}\n\nFor the author (decisions about the artifact):\n\n- {the hook, the time budget, what to leave out}\n", "skills/icm-architect/assets/templates/process": "# {process-name}\n\n{One sentence: the movement, not the nouns.}\n\n## Input → Movement → Output\n\n{Three sentences.}\n\n## Why this shape\n\n{What would break if the obvious shortcut existed.}\n\n## Steps\n\n1. {Cite `{path}:{line}`.}\n\n## If you change this\n\n- **Hits:**\n- **Does not hit:**\n\n## Surfaces\n\n| Surface | Role |\n|---|---|\n| {who} | {role} |\n\n## See\n\n- Objects: {links}\n- Source: `{path}`\n", "skills/icm-architect/assets/templates/questionnaire": "# Setup questionnaire — configure the factory once\n\nAnswers get written into `_shared/` as reference files. Every future run reads them; no run should ever re-ask them.\n\n1. Who is this workspace for, and what should a finished deliverable look like? (becomes `_shared/definition-of-done.md`)\n2. Voice and tone: paste two examples of past work that sound right, and one that sounds wrong. (becomes `_shared/voice.md`)\n3. Hard constraints that never bend: length, format, brand rules, compliance. (becomes `_shared/rules.md`)\n4. What does someone always check before anything ships, and could a script or a small model do part of it? (becomes each stage's Check line)\n5. What already exists that runs should reuse — templates, examples, data sources? (linked from `_shared/`, one home per fact)\n", "skills/icm-architect/assets/templates/source": "# {Name of the source}\n\n**File:** {path to the original}. Copy in [raw/{file}](raw/{file}).\n**How to cite:** `({key} {position})`. Position is {a timestamp (cite the one that opens the paragraph) | a page | a section}.\n\n## Parts\n\n{Write this table in slice 2, once the concept stubs exist, so its links resolve.}\n\n| Position | What it covers | Concept |\n|---|---|---|\n| {position} | {topic} | [{concept}](../concepts/{slug}.md) |\n\n## Words to fix on the way out\n\n| Heard | Write |\n|---|---|\n| {as transcribed} | {as meant} |\n\n## Gaps\n\n- {Where the source stops short of its stated length, drops out, or holds only one voice. Written here once; concepts link here.}\n\n## Keep out of any artifact\n\n- {Say what and where, not the content: \"a clause about a client at 26:11\". The phrase itself goes in `_meta/keep-out.txt`.}\n", "skills/icm-architect/assets/templates/stage-CONTEXT": "# {NN}_{stage-name} - {the job in five words}\n\nOne job: {the single thing this stage does}.\n\n## Inputs\n- Working (this run): `../{prev-stage-folder}/output/{file}` (the previous folder's real name; renumbering the pipeline means editing this path)\n- Reference (every run): `../../_shared/{rules-file}.md`\n- Reference (every run): `references/{stage-specific-guide}.md`\n- Example (optional): `examples/` (one real input and one good output from a run worth matching)\n\nDo NOT load: {anything an eager agent would wrongly pull in: other stages' references, prior runs, the whole `_shared/` folder}.\n\n## Process\n1. If an input is missing or empty, stop and say which.\n2. {Transform, following the reference constraints. A step that is code names its command, run from the workspace root: Run `python _tools/{script}.py {args}`.}\n3. {Hard limits worth restating: length, count, format.}\n\n## Outputs\n- `{artifact}.md` -> `output/`\n\n{For a shelf of notes instead of a stage: the notes this folder holds and the sections each must carry, from `_meta/schema.md`.}\n\n## Check\n{Who or what checks, as one concrete act: a person reads it aloud / `_tools/{script}.py` confirms the totals / a small model answers {question}. A check that isn't a person writes `check.md` beside the output, first line `pass` or `fail: <why>`. Edit the output in place; the next stage reads whatever is here.}\n", "skills/icm-architect/references/bundle-from-sources": "# Knowledge bundle from sources — ideas and their evidence, shaped to build from\n\nRead this when a bundle will feed artifacts (a lecture, course, script, article, doc set) and the wording must stay the speaker's. Sources go in: transcripts, interviews, notes, papers. The bundle holds the ideas, the speaker's words behind each, where each one stops, and which artifact uses which. The artifacts are built later, by a pipeline. Do not restate the invariants or the other forms; they live in `SKILL.md` and `forms.md`.\n\nTwo roles. The **speaker** is whoever's words are in the sources. The **author** builds the artifact and answers for it. Often they are the same person. When they are not, \"in their words\" means the speaker's, and every list of open questions splits in two: what only the speaker can supply, and what only the author can decide.\n\n## Size it to the corpus\n\n| Corpus | Build |\n|---|---|\n| one short source, one artifact | an outline; stop |\n| a short corpus feeding several artifacts, or whose wording must stay the speaker's | a light bundle: `sources/`, `concepts/`, `plans/`; `claims/` only when a claim leans on an outside fact. One root `CONTEXT.md` can hold the shelf contracts |\n| long sources (tens of thousands of words), or several artifacts sharing ideas | the full tree below |\n\n## Target tree\n\n```\n<subject>/\n├─ AGENTS.md                 catalog: what artifacts exist, where to start\n├─ _meta/\n│  ├─ schema.md              note types, citation format, privacy (from bundle-schema.md)\n│  ├─ sources.txt            optional: short citation key = raw file name\n│  └─ keep-out.txt           phrases that must never appear outside sources/raw/\n├─ _templates/               concept.md, source.md, plan.md, claim.md\n├─ _tools/                   quotes.py, links.py, index.py\n├─ sources/                  CONTEXT.md, _index.md, raw/ (verbatim, never edited), one note per source\n├─ concepts/                 CONTEXT.md, _index.md, one idea per file\n├─ plans/                    CONTEXT.md, _index.md, one artifact per file, plus map.md\n└─ claims/                   CONTEXT.md, claims to verify, lines to rework (only if there is something to put in it)\n```\n\nEach shelf's `CONTEXT.md` (from `stage-CONTEXT.md`) says what a note there carries, what it reads, and how it is checked. Each `_index.md` is generated: `python -I _tools/index.py sources concepts plans claims`. Do not create shelves for types you will not use; add `asks/`, `stories/` or `reading/` only when someone will query them.\n\nThe entry file routes: building an artifact → its plan, then only the concepts it names; the exact words → the concept's \"In their words\" (the raw copy is in `sources/raw/`); about to say a number or a general claim → `claims/`; something missing → the plan's Open list (ask, do not fill); adding an idea → copy `_templates/concept.md`, then run the checks; status → the `status:` line in each plan.\n\n## Notes\n\nCitations follow `_meta/schema.md`, the one home for the format: `\"verbatim line\" (key position)`.\n\n- **Concept** (`concept.md`): the idea stated once, in two or three sentences, saying only what the quoted lines say. **In their words**: verbatim lines, each cited, trimmed to the clean part and never tidied. **Where it stops**: the speaker's own limits and hedges; the loud version of an idea is rarely all of it. **Note**: your reading, marked as a proposal; delete it if you have none. **Related**: other concepts and the plans that use it.\n- **Source** (`source.md`): how to cite it, the words the transcription gets wrong with their fixes, **Gaps** (where it stops short or holds only one voice), and what stays out. Say what and where; the phrases themselves go in `_meta/keep-out.txt`.\n- **Claim** (`claim.md`): one block per outside fact: the speaker's quote with its citation, what it leans on, how and when it was checked, a status, and the safe line. The speaker's words never share a line with your verdict.\n- **Plan** (`plan.md`): who it is for and what they arrive with, the one idea, what they leave able to do, an opening that orients before it hooks, the spine (concepts in order, each with why it is there and whether it gets the full treatment or a line), the speaker's best lines copied from the concepts, the real thing to show, the claims that apply, and **Open**, split between the speaker and the author. A plan holds a route, not the artifact; if the script is in the plan, move it out. One artifact per plan. If there are several, `plans/map.md` covers the set: the few ideas everything rests on, the artifacts in a suggested order with status, and the decisions only the author can make.\n\nOne home per fact, so a gap is written once. A verifiable fact lives in `claims/`. A gap in a source lives in that source's note. A question only the speaker can answer lives in the plan's Open list. Concepts link to these; they do not repeat them.\n\n## Build pipeline (checked slices)\n\nStop after each slice. A person reads the output before the next slice starts. This pipeline replaces Build mode steps 1 and 3 to 5.\n\n**0 — Frame.** Ask what will be built and for whom. Ask who the speaker is, who the author is, and who answers each check. Ask whose words must survive, what must not be said (names, embargoes, client confidences), and what a citation points at (a time, a page). List the sources and the artifacts. Propose the note types and get approval.\n\n**1 — Set up and bring the sources in.** Copy each source into `sources/raw/` untouched, and write one source note each, leaving its Parts table for slice 2. From this skill, copy `assets/templates/bundle-schema.md` to `_meta/schema.md`, `assets/templates/keep-out.txt` to `_meta/keep-out.txt` (names and anything the speaker asked to keep out go in now; matching is whole-word, so list each form: `budget`, `budgets`), `assets/templates/entry.md` to `AGENTS.md` (plus the one-line pointer for each agent that reads another name, per `references/core.md`, Naming), the cards you need to `_templates/`, and `scripts/quotes.py`, `scripts/links.py` and `scripts/index.py` to `_tools/`. `quotes.py` should pass before any concept exists.\n\n**2 — Read all of it.** Read every source whole before writing a note; sampling gives a map of the opening. List the distinct ideas each source makes, once each, and cluster them by how the artifact will ask for them, not by where they appeared. Write a stub for every planned note, concepts, plans and claims alike (frontmatter with `status: stub` and a one-line description, and the title as the first heading), so links resolve from the first batch. Fill each source note's Parts table. Present the cluster list. The speaker or author adds, merges, drops.\n\n**3 — Concepts.** Fill the stubs one batch at a time, and write each shelf's `CONTEXT.md` when you first fill that shelf. After every batch run `python -I _tools/quotes.py` and `python -I _tools/links.py`, and fix the note, never the raw source. Read the warnings, and read the cuts with `--show-cuts`: a cut can change a meaning, and `quotes.py` fails one that drops a negation. The check: a reviewer reads three notes. Does it sound like the speaker? Does it say what they meant?\n\n**4 — Claims.** For every outside fact a concept leans on: if you can search, verify it, write the safe version of the line, and record how and when it was checked. A search summary is a lead, not a source; say so. If you cannot search, write the claim, what would settle it and where to look, as a to-look-up list for the person. Either way, a claim that is not verified is marked \"not checked,\" dated, and kept out of the plan's best lines. List the lines to rework (tone, transcription errors) and what stays out. Do this before any plan.\n\n**5 — Plans.** One per artifact, then `plans/map.md` if there are several. If the sources are the speaker's and not the audience's, write the audience's question in \"Arrives with\" as an assumption and list the audience's own words under Open. The author reads the plans before any artifact is written. The bundle stops here; building the artifact is a Pipeline's job, and its first stage reads one plan and the concepts that plan names, never the whole bundle.\n\n**6 — Walk it.** Regenerate the indexes and run the walk test below. No stub should be left.\n\n## What the tools enforce\n\n`quotes.py` fails on a quote not found near its cited position or on its cited page; a citation with no timestamp or page; an unknown source key; a bullet under \"In their words\" with no cited quote; a cut that drops a negation or leaves a piece too short to verify; and a keep-out phrase anywhere outside `sources/raw/` and `_meta/` (frontmatter, indexes and entry files included). It warns on a quote found in a neighboring paragraph and on eight or more quoted words with no citation. `links.py` fails on any link that does not resolve.\n\nA script can prove a quote is in the source. It cannot prove a paraphrase is fair, or that a synonym of a kept-out phrase is absent; that is what the reviewer's three notes are for.\n\n## Defining moves\n\n- **Quotes are word for word, cited, and checked by script.** A quote `quotes.py` cannot find is a typo or an invention; either way it does not ship.\n- **The speaker's words and yours never share a line.** Verbatim sits under \"In their words\". Your reading sits under \"Note\" and is a proposal.\n- **One idea, one note.** Plans and other notes link; they do not copy.\n- **Gaps are named, not filled.** Open lists name what only someone can supply: a story the speaker has not told, a number they have not given. Do not write it for them. Where the sources disagree with each other, say so in the concept's \"Where it stops\" and ask; do not reconcile them.\n- **People are described by role, never named** (the privacy rule in `_meta/schema.md`). Names live only in the raw copies, and later agents read the notes, never the raw copies, so a name cannot travel.\n- **Facts are checked before the plan, not after the artifact.**\n\n## Walk test (this variant)\n\nA cold agent, no memory of the sources:\n\n1. Open `AGENTS.md`. Can it say what artifacts exist and where to start?\n2. Open one plan. Can it list the spine and the speaker's best lines without opening a raw source?\n3. Do `quotes.py` and `links.py` pass, with no stub left in any `_index.md`?\n4. Open one concept. Does the unmarked paragraph say only what the quoted lines say? Anything beyond them sits under Note.\n5. Does any plan answer an Open item itself?\n6. Does one plan plus the concepts it names stay under about 8,000 tokens?\n\nIf a step fails, split or move files. Do not add a \"how to read this bundle\" note.\n\n## Failure modes\n\n- Summarizing the source instead of splitting it into ideas: the bundle becomes a second transcript.\n- Quotes tidied \"for readability,\" so they stop matching.\n- The same idea restated per artifact. One home.\n- A plan that contains the script.\n- Only the loud version of an idea: no \"Where it stops.\"\n- Smoothing over a disagreement between sources instead of asking.\n- Filling a spine with stories the sources do not contain.\n- Names, client details, or embargoed lines in notes.\n- Claims checked after the artifact.\n- Trusting the scripts for what they cannot see: whether a paraphrase is fair.\n- Note types multiplying past what anyone queries.\n- A hand-edited `_index.md`.\n", "skills/icm-architect/references/core": "# ICM Core\n\nThe detail behind the invariants, from the ICM paper (arXiv:2603.16021) and production workspaces. Read this when writing contracts, arguing a structural call, or checking a workspace against the method.\n\nContents: Five-layer hierarchy · Contract format · Naming · Library rules · Keeping steps small\n\n## The five-layer context hierarchy\n\n| Layer | Typical file | Question it answers | Role | Size |\n|---|---|---|---|---|\n| L0 | `AGENTS.md` | Where am I? | routing | 300–800 tokens |\n| L1 | root `CONTEXT.md` | Where do I go? | routing | 200–500 tokens |\n| L2 | stage `CONTEXT.md` | What do I do? | **the control point** | 200–500 tokens |\n| L3 | `references/`, `_shared/` | What rules apply? | factory (stable) | 500–2k tokens |\n| L4 | `output/`, run artifacts | What am I working with? | product (per-run) | varies |\n\n- L0–L2 are the catalog: small, stable, no content payload.\n- L2 is the control surface of the whole system. Its Inputs section is what makes context selection explicit, editable, and auditable instead of left to agent judgment.\n- L3 vs L4 is the factory/product split. L3 is the recipe (voice.md, design-system.md, schema.md); L4 is the ingredients and the dish (research-output.md, draft.md).\n- A large L3 collection gets its own internal `CONTEXT.md` router: the L1 routing pattern applied recursively, inside any folder that grows past easy scanning.\n\n## Contract format\n\nEvery working folder carries a `CONTEXT.md` shaped like this (copy from `assets/templates/stage-CONTEXT.md`):\n\n```markdown\n# 02_script - turn research into a script\n\nOne job: write the script from the research output.\n\n## Inputs\n- Working (this run): `../01_research/output/research.md`\n- Reference (every run): `../../_shared/voice.md`\n- Reference (every run): `references/structure.md`\n\nDo NOT load: other stages' references, earlier runs, the whole `_shared/` folder.\n\n## Process\n1. If an input is missing or empty, stop and say which.\n2. Draft to the structure in structure.md, in the tone of voice.md.\n3. Keep it under 90 seconds spoken.\n\n## Outputs\n- `script_draft.md` -> `output/`\n\n## Check\nA person reads the draft aloud and confirms the argument order survived from research. Edit in place; the next stage reads whatever is here.\n```\n\nRules: inputs are exact backticked paths, split working vs reference. The process is numbered and short; constraints live in L3 files, not restated here, and a step that is code names its command. Commands run from the workspace root and say `python`; use `python3` or `py` where that is the name. Exactly one check, stated as something a person, a script or a small model does, never a vague \"review\". A check that isn't a person writes `check.md` beside the output, first line `pass` or `fail: <why>`.\n\n## Naming\n\n- The entry file is `AGENTS.md`. A tool that reads another name gets a one-line pointer, never a second copy (syntax as of October 2026): `CLAUDE.md` holds `@AGENTS.md` for Claude Code; `GEMINI.md` holds `@./AGENTS.md` for Gemini CLI; anything else gets a file that says \"Read AGENTS.md first.\"\n- Stage folders: `NN_kebab-name` (`01_research`). Ordinal-only prefixes (`00-tracker.md`) for ordered files inside a folder.\n- Underscore folders are about the workspace, not of the work, and sort to the top: `_shared/` (the factory), `_templates/`, `_tools/` (scripts), `_meta/` (schema and rules), `_archive/`.\n- Records and nodes: kebab-case slugs for machine-facing files, or Title Case where a person browses daily (an Obsidian vault). Pick one per workspace and write the choice into the schema; drift between schema and files is the most common decay.\n- Typed content files may prefix their type: `data-customer-list.md`.\n- Templates are blank, named for what they produce, and live together: `_templates/pilot-brief.md`.\n\n## Library rules\n\n- **The catalog holds no books.** Routing files point at everything and store almost nothing. When a routing file grows, it is absorbing payload: move the payload to a shelf.\n- **One home per fact; a link beats a copy.** Duplication is how structures rot.\n- **Generated indexes are never hand-edited.** An index built from frontmatter by a script (`_tools/index.py`) cannot drift; a hand-curated one always does.\n- **The structure is the documentation.** If something needs explaining, the explanation goes in that folder's `CONTEXT.md`, not in a wiki elsewhere and not in anyone's head. A new collaborator should understand the pipeline by reading the CONTEXT files top to bottom, without running anything.\n- **Method and instance live apart.** The blank, reusable template of a structure is a different artifact from any filled-in deployment of it. When a structure proves out, extract the template before it tangles with the data.\n- **Working sessions end in artifacts.** A workshop, interview, or planning call that produces only slides has failed the structure; it should end with files the structure can shelve.\n\n## Keeping steps small\n\nA step's full context (entry file, contract, references, inputs) should stay under about 8,000 tokens. That keeps every load auditable. A monolithic everything-prompt for the same pipeline typically runs 30k–50k tokens, most of it irrelevant to the current step; ICM never loads those tokens rather than compressing them later. If a step's context balloons, split the stage, tighten the Inputs list, or push detail down into an L3 file the contract points at but doesn't inline.\n", "skills/icm-architect/references/forms": "# The forms\n\nEach form is a recipe over the three primitives in SKILL.md: sequence, shelf, catalog. What changes is the repeating unit and what the structure optimizes for. All of them are drawn from production workspaces, not theory. The table that picks one lives in SKILL.md (Build mode, step 2).\n\nContents: 1 Pipeline · 2 Record library · 3 Knowledge bundle · 4 Context map · 5 System map\n\n## 1. Pipeline — the production line\n\nThe paper's canonical shape. The same sequence runs weekly or daily with different input, every stage ends at a check, and a deliverable leaves at the end.\n\n```\nworkspace/\n├─ AGENTS.md               identity + routing table\n├─ CONTEXT.md              the pipeline in one screen\n├─ stages/\n│  ├─ 01_research/   {CONTEXT.md, references/, output/}\n│  ├─ 02_script/     {CONTEXT.md, references/, output/}\n│  └─ 03_production/ {CONTEXT.md, references/, output/}\n├─ _shared/                factory: voice.md, design-system.md\n├─ _tools/                 scripts the stages call\n└─ setup/questionnaire.md  configures the factory once\n```\n\n**Defining moves:**\n- Handoff = one stage's `output/` is the next stage's input. A person (or the stage's named check) reads the file in between; the next stage reads whatever is there.\n- Each contract carries a \"load this / do NOT load that\" inputs list.\n- `status` is answered by scanning `stages/*/output/` for files and any `check.md` verdicts.\n- Stage boundaries sit where the person naturally pauses to check. Surfacing the judgment call (an outline, a structural plan) as an editable file *before* the expensive downstream work is the whole trick: correction is cheapest at the earliest check.\n- Several pipelines that share one brand or voice (an Umbrella) each keep their own entry file and share no state except the factory at the root. The root entry file routes by task (\"a talking-head video: 03; animating a diagram: 05\") and holds nothing else.\n\n**Expect a U-curve of human editing:** heavy at the first stage (direction-setting), light in the middle (constrained by both anchors), heavy at the last (aligning output with earlier decisions). Design the first and last outputs to be especially easy to edit.\n\n**Watch for:** stages that do two jobs (split them); contracts that restate reference material (point instead); pipelines built before the process has actually repeated (don't); shared reference copied into each pipeline of an Umbrella (link up instead).\n\n## 2. Record library — the unit is a record\n\nNothing \"runs\" to completion; records (people, clients, sessions, deals) get created, accumulate, and are looked up. The structure optimizes retrieval and uniform shape.\n\n```\nworkspace/\n├─ AGENTS.md               identity + routing\n├─ CONTEXT.md              the record shape and its lifecycle\n├─ _shared/                factory: the method, rules, shared knowledge\n├─ _templates/\n│  └─ record-template/     the stamp: every record starts as a copy of this\n├─ _tools/index.py\n└─ records/\n   ├─ _index.md            generated: one line per record, with its status\n   ├─ acme-corp/           each record the same internal shape\n   └─ jane-doe/\n```\n\n**Defining moves:**\n- **A new record is a copy, not a blank page.** The template *is* the schema.\n- Each record states its own status in one line (`status:` in the frontmatter of the record's `CONTEXT.md`), and the statuses form a small lifecycle (`briefed → active → archived`). `records/_index.md` is generated from them: `python -I _tools/index.py records`.\n- Naming convention doubles as an id scheme (`ht10-second-brain`: type + counter + slug).\n- Records can recurse: each record may internally be a mini knowledge bundle or pipeline (a person-record holding its own layered brain; a session-record holding its own six-stage line). Uniformity across records is what makes the library queryable.\n\n**Watch for:** records drifting from the template shape (re-stamp them); status kept anywhere but the record itself; half-created records with only one file (finish the stamp or archive it).\n\n## 3. Knowledge bundle — the product is the knowledge\n\nThe deliverable is a navigable body of knowledge: a brain, a domain wiki, a model of a person or subject, or the ideas an artifact will be built from. Often filled by a pipeline from sources (factory and product as two separate top-level trees).\n\n```\nworkspace/\n├─ AGENTS.md\n├─ corpus/                 raw sources; a source with no note in the bundle is unprocessed\n├─ extraction/             the factory: an ICM Pipeline whose output is the bundle\n└─ bundle/                 the product:\n   ├─ index.md             what's in here, layer by layer\n   ├─ voice/  (layer A)    always-load essentials\n   ├─ dispositions/ (B)    load-by-task\n   └─ episodes/ (C)        evidence, loaded last, access-tiered\n```\n\n**Defining moves:**\n- Every note carries typed YAML frontmatter (`type:`, `layer:`, `access_tier:`, `strength:`): labels make it queryable, links make it a graph.\n- Notes cross-link by relative path; navigation is link-following, not folder-crawling. A note that is planned but not written yet is a stub (frontmatter only, `status: stub`), so links to it resolve from the start.\n- Layered loading is the reading protocol: always-load layer first, task-relevant notes second, evidence only when needed. Never slurp the bundle.\n- `access_tier` gates what may leave the machine: patterns abstracted from private sources are fine; raw quotes are not.\n- Regenerating the bundle is a factory run; every change appends to a log.\n\n**From sources.** When the bundle feeds artifacts (a lecture, course, scripts, docs) and the wording must stay the speaker's, fill it from `sources/raw/` (verbatim, never edited) into `concepts/` (one idea each, quotes cited `(key position)`), `claims/` (outside facts to verify) and `plans/` (one artifact's route through the concepts). `_tools/quotes.py` fails any quote it cannot find in its source. Method: [bundle-from-sources.md](/skills/icm-architect/references/bundle-from-sources.md).\n\n**Watch for:** the bundle read as a search index instead of a model (it answers \"how does this think,\" not \"find me the file\"); frontmatter fields nobody queries (cut them); extraction runs that edit the product by hand (fix the factory); quotes tidied until they no longer match their source.\n\n## 4. Context map — the organization as a graph\n\nThe subject is a company or team: who does what, what data moves where, what's ripe for automation. Nodes + labels + links rather than stages.\n\n```\nworkspace/\n├─ AGENTS.md               entry\n├─ CONTEXT.md              how to walk the map\n├─ _meta/                  the rules: schema.md, maturity-levels.md, ritual docs\n├─ teams/\n│  └─ marketing/\n│     ├─ Marketing.md      node card: In / Movement / Out / Edges\n│     ├─ governance.md\n│     ├─ jobs/             outcome nodes\n│     ├─ processes/        workflow nodes (the workhorses)\n│     └─ data/             data-<thing>.md asset nodes\n├─ patterns/               cross-team patterns, written bottom-up only\n└─ dashboards/             00-tracker.md … live queries over frontmatter (Obsidian Dataview, if the map is a vault)\n```\n\n**Defining moves:**\n- A closed set of node types (team, job, process, data-asset, governance, pattern) defined once in `_meta/schema.md` (from `context-map-schema.md`); every node declares its `type:` in frontmatter.\n- Process nodes (`context-map-node.md`) carry the scoring frontmatter: owner, ai-level (L0 manual → L3 integrated), frequency, value 1–5, pain 1–5, `consumes:`/`produces:` as paths to data assets. The links draw the org graph on their own (`_tools/links.py --graph`, then `viz.py`); high value + high pain = pilot candidate.\n- Each folder's `_index.md` is generated by `_tools/index.py`: agents jump there, never crawl.\n- **The workshop is the data event.** Map live with the team; every session ends in clean node files, not slides. \"You don't point an agent at a legacy mess; you clean the shelf first.\"\n- The librarian ritual per team: inventory → single source of truth → give it shape → catalogue → shelve by sensitivity → connect the agent. The person stays the approval check; the agent drafts and proposes.\n- Patterns require three independent occurrences: one team complaining is a gripe, three teams landing on the same workflow and the same pain is structure.\n\n**Watch for:** schema mandating names the files stopped using (reconcile immediately); instance data tangled into the reusable method (extract the blank starter kit early); node types multiplying past what anyone queries.\n\n## 5. System map — a body of work as an edit graph\n\nThe subject is a tree someone will change: a repository, a markdown vault, or both. Nouns become object cards, verbs become process cards, and `effects/` is an index into them, so a later agent can answer \"what is this\" and \"what else moves\" without slurping the tree. Its audit pipeline, card sections and walk test: [system-map.md](/skills/icm-architect/references/system-map.md).\n", "skills/icm-architect/references/system-map": "# System map — audit a body of work so later agents can edit it\n\nRead this when the repeating unit is **a folder someone will change**: a repo, a markdown vault, or a mix. The deliverable is not a run and not a company chart. It is a walkable graph: what the nouns are, how they move, and what else moves if you touch one.\n\nDo not restate the invariants or the other forms. Those live in `SKILL.md` and `forms.md`.\n\n## When to use it\n\nThe user wants to work on a tree they do not hold in their head: \"map this repo,\" \"audit this folder,\" \"what would a change hit,\" \"make this editable for the next agent.\" The tree may be code, markdown, or both.\n\nDo **not** use this form when they want a repeating production line (Pipeline), a company or team graph (Context map), or a model of how someone thinks or the ideas behind the code laid out to teach from (Knowledge bundle).\n\nIf the tree is small enough that one `CONTEXT.md` plus an index answers \"what is X\" and \"what else moves,\" stop there. Do not scaffold `objects/` / `processes/` / `effects/` for a dozen files.\n\n## What the map is\n\nA **record library of nouns** plus a short shelf of **verbs**, plus a **change-impact index**. The subject tree stays the source of truth. The map cites it. The map never becomes a second spec.\n\n| Universe | Meaning |\n|---|---|\n| **live** | In force. Implement and cite against these. |\n| **leftover** | Still present, no longer the main path. Touch only if that path is in scope. |\n| **ghost** | Named or filed, not wired (stubs, dead types, docs of functions that do not exist). Do not implement against these. |\n\nProduct language and file/type names often disagree. State both once in the catalog (\"Chat = `Incubator`\").\n\n## Where it lives\n\nPropose before writing. Prefer a `map/` shelf next to existing orientation (`developer-docs/`, `docs/`, vault root) so the subject's entry file (`AGENTS.md`, `CLAUDE.md` or whatever it already uses) can add one routing row. Do not drop a map inside `src/` or scatter cards through the tree you are mapping. The map's entry file is `map/AGENTS.md`.\n\n## Target tree (smallest that carries the work)\n\n```\nmap/\n├─ AGENTS.md              L0 catalog\n├─ CONTEXT.md             how to walk; the universes; name collisions\n├─ _meta/schema.md        closed node types\n├─ _templates/            object.md, process.md\n├─ _tools/                index.py, links.py\n├─ objects/\n│  ├─ CONTEXT.md\n│  └─ <cluster>/          cards, plus a generated _index.md (one line per card, with its status)\n├─ processes/             only after nouns exist; only real movements\n└─ effects/CONTEXT.md     which cards to open before a change\n```\n\nDo not create `processes/` or `effects/` empty. Three verified noun clusters beat seven imagined shelves.\n\n## Audit pipeline (checked slices)\n\nThis pipeline replaces Build mode steps 1 and 3 to 5; it never moves the subject's files. Stop after each slice. A person or a cold walk reads the output before the next slice starts.\n\n### 0 — Inventory, do not write cards\n\nList the tree. Classify each area: catalog / contract / factory / product / dead (Restructure mode). Infer nouns (types, durable files, note kinds) and verbs (movements that repeat). Mark universe. Present the proposed tree and cluster list. Get approval.\n\nOn a code-heavy tree, an AST graph tool (e.g. `graphify extract --code-only`: local, no model) can draft the inventory. Its EXTRACTED edges carry `file L<line>` and can seed citations and Hits; INFERRED edges are proposals that pass a check. Never paste its report into a card, or install its assistant hooks in the workspace. On private material add `--backend ollama` and set `GRAPHIFY_QUERY_LOG_DISABLE=1`.\n\n### 1 — Catalog\n\nWrite `AGENTS.md`, `CONTEXT.md`, the schema, templates, and a stub card (frontmatter only, `status: stub`) for every noun you will not fill yet. Run `python -I _tools/index.py objects/<cluster>` for each cluster. Wire one routing row from the subject's existing entry file. Walk: \"where do I go to understand X?\" lands in two hops.\n\n### 2 — Nouns (objects)\n\nOne card per type, copied from `_templates/object.md`. Cluster by how an editor asks, not by folder layout.\n\n**Source of truth**\n\n- Code: the type / table / module. Cite `path:line`. If a comment and the code disagree, the code wins and the card says so.\n- Markdown / mixed: the file that owns the fact. Cite path. If two notes disagree, pick one home and link.\n\n`status: verified` only with a date, a branch or commit (or vault revision), and citations. `stale` is allowed. A confident wrong date is not. Regenerate the cluster's `_index.md` after a batch.\n\nFill **If you change this** as **Hits** / **Does not hit**. First-order only. \"Does not hit\" names the obvious next noun that is the *wrong* one.\n\nRe-verify load-bearing claims against source before calling the slice done. Do not paste an audit report into a card.\n\n### 3 — Verbs (processes)\n\nOnly movements that actually run or are actually followed. Typical code set: auth, publish/push, hydrate/load, run/turn, promote/export. Typical vault set: ingest, revise, publish.\n\nEach process card: Input → Movement → Output; numbered steps with citations; `consumes` / `produces` as links to object cards; Hits / Does not hit.\n\n### 4 — Change-impact index\n\n`effects/CONTEXT.md` is a catalog: \"if you are changing X, open these cards.\" It does not copy waterfalls. If the index and a card disagree, fix the card.\n\nThen walk it backwards. The index answers \"I am changing X, what inside the tree moves.\" It does not answer \"what outside the tree points in.\" Ask the owner (configs, issue trackers, agents, scheduled jobs) for absolute paths into the subject, and record each one on the card it lands on. These consumers break silently: nothing in the tree references them, so no card names them until you go looking.\n\n### 5 — Re-verify\n\nAfter the first fill, check the load-bearing claims again (especially Hits / Does not hit). Wrong waterfalls are more expensive than missing cards.\n\n## Object card (required sections)\n\n1. One sentence: product name and code/file name if they differ\n2. Why this shape: the load-bearing why, not a field tour\n3. Shape: keys, constraints, or owning files, with citations\n4. Connected to: owns / owned-by / joins / looks-like-but-is-not\n5. If you change this: Hits / Does not hit\n6. Surfaces: who reads/writes (apps, agents, people, none)\n7. See: the source file; at most one as-built page\n\n## Walk test (this form)\n\nA cold agent, no memory of the subject:\n\n1. Open the subject's entry file. Is the map one hop away?\n2. Open `map/AGENTS.md`. Can it say what the colliding names mean without opening a card?\n3. Open one object card. Does it cite source, state the why, and give a first-order waterfall?\n4. From `effects/CONTEXT.md`, can it name what a stated change hits and what it does not?\n5. Follow one `See` link. Does it land on source, not another essay?\n6. Does the entry file, a hub and one card stay under about 8,000 tokens?\n\nIf a step fails, split or move files. Do not add a \"how to read this map\" novel.\n\n## Failure modes\n\n- Mapping FeatureRequests / aspiration as live. Ghost it.\n- Copying as-built behaviour into cards. Point at the file that owns it.\n- Empty process/effects folders.\n- Cards with no citations marked `verified`.\n- Slurping the whole `objects/` folder in a later session: the catalog exists so you do not.\n- An `effects/` index that only walks outward. What points INTO the tree from outside is invisible from inside it.\n", "stages/01-probe/CONTEXT": "# 01-probe - Browser and Canvas State Discovery\n\nOne job: Probe the browser canvas and write target metadata to output/probe_state.json.\n\n## Inputs\n\n| Source | File/Location | Section/Scope | Why |\n| :--- | :--- | :--- | :--- |\n| System Invariants | `../../_config/invariants.md` | Network Ports | Port 9222 connection |\n| Vision Schemas | `../../shared/vision_schemas.md` | Vision Invariants | Coordinate normalization |\n\nDo NOT load: ../02-controller/, ../03-execute/, or ../../benchmarks/.\n\n## Process\n\n> 1. Connect to Chrome CDP on Port 9222 using Playwright.\n> 2. Locate the Splatbox HTML5 canvas element (`#gameCanvas`).\n> 3. Capture a 1280x720 screenshot of the canvas.\n> 4. Extract canvas CSS bounding box dimensions.\n> 5. Save metadata to output/probe_state.json.\n\n## Outputs\n\n| Artifact | Location | Format |\n| :--- | :--- | :--- |\n| Probe State | output/probe_state.json | JSON schema with canvas rect |\n| Stage Audit Receipt | output/check.md | YAML-frontmattered Markdown |\n\n## Check\n\nRun python3 -m json.tool output/probe_state.json and verify width and height keys exist.\n", "stages/01-probe/output/check": "# Audit: PASS\n", "stages/01-probe/output/checkpoint": "# Checkpoint: AUTO_APPROVED_BY_CONTRACT\n", "stages/01-spec/CONTEXT": "# Stage 01 Contract: Specification & Intent Scoping (01-spec)\n\n## Inputs\n\n| Source | File/Location | Section/Scope | Why |\n| :--- | :--- | :--- | :--- |\n| User Task | Active Prompt / Issue | Full description | Primary problem statement |\n| Hardware Rules | ../../rules/hardware_vram_invariants.md | ## Envelope Limits | Enforce hardware VRAM & zero-code bounds per rules/hardware_vram_invariants.md |\n| System One Gates | ../../rules/anti_rationalization_tables.md | ## Intent & Scope Guards | Prevent scope creep and unrequested code |\n| Epistemic Rules | ../../rules/anti_sycophancy_directives.md | ## Premise Validation | Reject flawed user assumptions early |\n\n## Process\n\n> 1. Parse the user request and inspect referenced files using native file_tools or openviking memory search.\n> 2. Validate the request against Intent Guard and Scope Guard: confirm zero custom orchestration scripts are requested.\n> 3. Define explicit acceptance criteria, touched file boundaries, and hardware invariants.\n> 4. Run the Stage 01 Audit below and write output/spec_packet.md.\n\n## Outputs\n\n| Artifact | Location | Format |\n| :--- | :--- | :--- |\n| Specification Packet | stages/01-spec/output/spec_packet.md | Markdown with YAML frontmatter (status, scope_hash) |\n\n## Checkpoint & Audit\n\n* **Checkpoint**: Pause if user requirements conflict with the Zero-Custom-Code Imperative or rules/hardware_vram_invariants.md ceiling.\n* **Audit**: [ ] Exact target files listed; [ ] No custom .py wrappers proposed; [ ] Hardware ceiling explicitly cited.\n", "stages/01-spec/invariants": "# Stage Invariants (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 80 lines\n\n1. **Sub-8K Context Ceiling**: Active working context must remain strictly between 2,000 and 8,000 tokens.\n2. **Deterministic Output**: Stage outputs must be written as structured JSON/Markdown artifacts inside `output/`.\n3. **Hardware Realism**: Memory consumption on discrete NVIDIA RTX 3050 must not exceed 5,800.0 MiB.\n", "stages/01-spec/references": "# Stage Epistemic References (Layer 3)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 200 lines\n\n1. **ICM State Machine**: RinDig/icm-architect Invariants 1, 4, 7, and 9 (arXiv:2603.16021).\n2. **NousResearch Hermes Agent**: Built-in CLI flags (`--in`, `--accept-hooks`, `--max-turns 12`, `--tui`).\n3. **Port Topology**: Inference (8138), Gateway (8642), Memory (1933), Embeddings (8139).\n", "stages/01-spec/rules": "# Stage Operational Rules (Layer 2)\n\n> Architectural Standard: Jake Van Clief's ICM (arXiv:2603.16021)\n> Line Cap: <= 120 lines\n\n1. **Clean Stage Handoff**: Read the input contract and previous stage output before mutating state.\n2. **Zero Monolithic Bloat**: Never perform multi-stage work in a single turn; terminate after generating the stage artifact.\n3. **Pre-Commit Verification**: Run local AST and linter checks (`ruff check`) before committing or closing the stage.\n", "stages/02-controller/CONTEXT": "# 02-controller - CPU OpenCV HoughCircles Aiming Controller\n\nOne job: Compute target centroids on CPU from probe metadata and write output/aim_controller.py.\n\n## Inputs\n\n| Source | File/Location | Section/Scope | Why |\n| :--- | :--- | :--- | :--- |\n| Stage 1 Output | ../01-probe/output/probe_state.json | Full JSON file | Canvas bounding rect & DPI ratio |\n| System Invariants | ../../_config/invariants.md | Section 1: CPU Vision Offload | Enforce 0 MiB GPU VRAM & <5 ms |\n| Vision Schemas | ../../shared/vision_schemas.md | HoughCircles Parameters | Coordinate scaling math |\n\nDo NOT load: ../03-execute/, ../../benchmarks/, or ../../phases/.\n\n## Process\n\n> 1. Read ../01-probe/output/probe_state.json and verify width and height keys exist.\n> 2. Calculate CSS-to-canvas coordinate scale ratio (canvas.width / rect.width).\n> 3. Implement OpenCV cv2.HoughCircles centroid detection on CPU (0 MiB GPU VRAM, < 5 ms execution).\n> 4. Write the modular controller (<60 lines) to output/aim_controller.py.\n\n## Outputs\n\n| Artifact | Location | Format |\n| :--- | :--- | :--- |\n| Aiming Controller |
